<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#20c997">
<title>재미있는 영어놀이 🔤</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='90'>🔤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2b2d42; --muted: #7a7f99; --card: #ffffff; --line: #e6e8f0;
  --good: #2fb36d; --bad: #ff5a5f;
  --main: #ff7a59; --main2: #ffb199; --soft: #ffece5;
}
.t-little { --main: #ff7a59; --main2: #ffb199; --soft: #ffece5; }
.t-big    { --main: #5b5bf0; --main2: #a3a3ff; --soft: #ececff; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  background: linear-gradient(160deg, #e6fcf5 0%, #e8f4ff 55%, #fff0f6 100%) fixed;
  color: var(--ink); min-height: 100vh; overflow-x: hidden;
  user-select: none; -webkit-user-select: none;
}
button { font-family: inherit; cursor: pointer; border: 0; color: inherit; }
b { font-weight: normal; color: var(--main); }
.en { font-family: 'Jua', 'Comic Sans MS', 'Segoe UI', sans-serif; }

.screen { max-width: 760px; margin: 0 auto; padding: 16px 16px 32px; min-height: 100vh; }

/* ---------- 공통 ---------- */
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.topbar .ttl { flex: 1; font-size: 20px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon { width: 46px; height: 46px; border-radius: 14px; background: #fff; font-size: 22px; box-shadow: 0 3px 0 var(--line); flex: none; text-decoration: none; display: grid; place-items: center; }
.icon:active { transform: translateY(2px); box-shadow: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 22px; border-radius: 18px; font-size: 20px; background: var(--main); color: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--main) 70%, #000); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--main) 70%, #000); }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--line); }

/* ---------- 홈 ---------- */
.home-hero { text-align: center; margin: 18px 0 22px; }
.home-hero .logo { font-size: 64px; animation: bob 2.4s ease-in-out infinite; }
.home-hero h1 { font-size: 36px; margin: 6px 0 4px; font-weight: normal; }
.home-hero p { color: var(--muted); margin: 0; font-size: 17px; }
.tracks { display: grid; gap: 16px; }
.track-card { position: relative; text-align: left; background: #fff; border-radius: 28px; padding: 22px 22px 20px; box-shadow: 0 8px 0 var(--main2), 0 14px 30px rgba(0,0,0,.08); border: 3px solid var(--main2); display: flex; gap: 16px; align-items: center; width: 100%; }
.track-card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--main2); }
.track-card .te { font-size: 64px; flex: none; animation: bob 2.8s ease-in-out infinite; }
.track-card .age { display: inline-block; background: var(--main); color: #fff; border-radius: 999px; padding: 3px 12px; font-size: 15px; }
.track-card h2 { font-size: 27px; margin: 6px 0 2px; font-weight: normal; }
.track-card .ts { color: var(--muted); font-size: 15px; }
.track-card .tstat { margin-top: 8px; font-size: 16px; }
.track-card .who { font-size: 16px; color: var(--main); }
.edit-name { position: absolute; top: 12px; right: 12px; background: var(--soft); border-radius: 12px; padding: 6px 10px; font-size: 14px; }
.home-foot { display: flex; justify-content: center; gap: 10px; margin-top: 26px; flex-wrap: wrap; }

/* ---------- 단계 목록 ---------- */
.track-head { background: #fff; border-radius: 24px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 0 var(--main2); margin-bottom: 14px; }
.track-head .te { font-size: 46px; }
.track-head h2 { margin: 0; font-size: 24px; font-weight: normal; }
.track-head p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.quick button { background: var(--soft); border-radius: 18px; padding: 14px 10px; font-size: 18px; box-shadow: 0 4px 0 color-mix(in srgb, var(--main2) 60%, #fff); }
.quick button small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.pts { display: inline-block; background: #f3e8ff; color: #9c36b5; border-radius: 999px; padding: 0 10px; margin-left: 4px; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.lv { position: relative; text-align: left; background: #fff; border-radius: 22px; padding: 16px; box-shadow: 0 5px 0 var(--line); display: flex; gap: 12px; align-items: center; min-height: 96px; }
.lv:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.lv .le { font-size: 40px; flex: none; width: 52px; text-align: center; }
.lv .ln { font-size: 13px; color: var(--main); }
.lv .lt { font-size: 19px; line-height: 1.2; }
.lv .ld { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.lv .ls { font-size: 17px; margin-top: 4px; letter-spacing: 1px; color: #ffc107; }
.lv .ls .off { color: #dde1ea; }
.lv.locked { opacity: .55; }
.lv.locked .le { filter: grayscale(1); }
.lv .lock { position: absolute; right: 12px; top: 10px; font-size: 20px; }
.settings { margin-top: 18px; background: #fff; border-radius: 20px; padding: 14px 16px; display: grid; gap: 10px; }
.settings .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 17px; }
.seg { display: inline-flex; background: #f1f3f8; border-radius: 14px; padding: 4px; }
.seg button { background: transparent; padding: 8px 14px; border-radius: 10px; font-size: 16px; color: var(--muted); }
.seg button.on { background: var(--main); color: #fff; }

/* ---------- 플레이 ---------- */
.play { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 16px; }
.path { display: flex; align-items: center; gap: 4px; background: #fff; border-radius: 999px; padding: 6px 10px; margin-bottom: 12px; }
.path .step { flex: 1; height: 30px; border-radius: 999px; background: #f1f3f8; display: grid; place-items: center; font-size: 15px; position: relative; }
.path .step.done { background: var(--soft); }
.path .step.cur { background: var(--main2); }
.path .runner { position: absolute; font-size: 26px; top: -8px; animation: hop .6s ease-in-out infinite alternate; }
.path .goal { font-size: 26px; flex: none; }
.timebox { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.timebar { flex: 1; height: 22px; border-radius: 999px; background: #fff; overflow: hidden; }
.timebar div { height: 100%; width: 100%; background: linear-gradient(90deg, #ff6b6b, var(--main)); transition: width .1s linear; border-radius: 999px; }
.timebox .tn { font-size: 22px; min-width: 120px; text-align: right; }

.qcard { background: #fff; border-radius: 28px; padding: 18px 16px 14px; box-shadow: 0 8px 0 var(--main2); text-align: center; position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; min-height: 260px; }
.qtext { font-size: 20px; line-height: 1.45; color: var(--muted); }
.qtext:empty, .visual:empty { display: none; }
.visual { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.bigword { font-size: clamp(40px, 11vw, 66px); line-height: 1.15; letter-spacing: 1px; word-break: keep-all; }
.bigword.ko { font-size: clamp(34px, 9vw, 54px); }
.bigemoji { font-size: clamp(80px, 22vw, 120px); line-height: 1.1; animation: pop .35s ease; }
.sentence { font-size: clamp(22px, 6vw, 32px); line-height: 1.5; max-width: 620px; }
.sentence small { color: var(--muted); font-size: .7em; }
.ko-line { color: var(--muted); font-size: 18px; }
.gap { display: inline-block; min-width: 2.2em; padding: 0 .25em; border-radius: 12px; border: 3px dashed var(--main2); background: var(--soft); color: var(--main2); text-align: center; line-height: 1.2; }
.gap.good { border: 3px solid var(--good); background: #e3f9ec; color: var(--good); animation: pop .35s ease; }
.gap.reveal { border: 3px solid var(--bad); background: #ffeceb; color: var(--bad); }
.listen { background: var(--soft); border-radius: 999px; padding: 10px 22px; font-size: 22px; box-shadow: 0 4px 0 var(--main2); }
.listen.big { font-size: 30px; padding: 18px 34px; animation: glow 1s ease-in-out infinite alternate; }
.listen:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--main2); }

.hintbtn { position: absolute; right: 12px; top: 12px; background: #fff8d6; border-radius: 14px; padding: 6px 12px; font-size: 16px; box-shadow: 0 3px 0 #f2e2a0; }
.hintbox { background: #fffbea; border: 2px dashed #ffd666; border-radius: 18px; padding: 10px 14px; font-size: 18px; line-height: 1.5; display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 100%; }
.hintbox p { margin: 0; }
.hintbox[hidden] { display: none; }
.explain { font-size: 19px; line-height: 1.6; }
.explain small { color: var(--muted); font-size: 16px; }
.feedback { min-height: 30px; font-size: 22px; }
.feedback.good { color: var(--good); animation: pop .35s ease; }
.feedback.bad { color: var(--bad); }
.sec { display: inline-block; background: #e7f5ff; color: #1c7ed6; border-radius: 999px; padding: 0 10px; margin-left: 4px; }
.sec.fast { background: #fff3bf; color: #e67700; }
.combo { display: inline-block; background: #fff0e0; color: #ff6b00; border-radius: 999px; padding: 0 10px; margin-left: 4px; }

.answer { margin-top: 14px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choices.one { grid-template-columns: 1fr; }
.choice { font-size: clamp(24px, 6.5vw, 34px); padding: 16px 8px; border-radius: 22px; color: #fff; min-height: 76px; line-height: 1.2; word-break: keep-all; }
.choice.c0 { background: #ff6b6b; box-shadow: 0 6px 0 #d94848; }
.choice.c1 { background: #4dabf7; box-shadow: 0 6px 0 #2f87d1; }
.choice.c2 { background: #51cf66; box-shadow: 0 6px 0 #34a84a; }
.choice.c3 { background: #b197fc; box-shadow: 0 6px 0 #8c6fe0; }
.choice.cs-letter { font-size: clamp(40px, 11vw, 56px); padding: 10px 8px; }
.choice.cs-sentence { font-size: clamp(19px, 5vw, 24px); text-align: left; padding: 14px 18px; min-height: 0; }
.choice.cs-emoji, .choice.cs-swatch { background: #fff; color: var(--ink); border: 5px solid; font-size: clamp(54px, 15vw, 76px); padding: 6px; }
.choice.cs-emoji.c0, .choice.cs-swatch.c0 { border-color: #ff6b6b; }
.choice.cs-emoji.c1, .choice.cs-swatch.c1 { border-color: #4dabf7; }
.choice.cs-emoji.c2, .choice.cs-swatch.c2 { border-color: #51cf66; }
.choice.cs-emoji.c3, .choice.cs-swatch.c3 { border-color: #b197fc; }
.sw { display: block; height: 70px; border-radius: 14px; border: 2px solid #dfe3ec; }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.choice.wrongc, .choice:disabled { opacity: .3; transform: scale(.94); }
.choice.rightc { outline: 5px solid var(--good); outline-offset: 3px; opacity: 1; transform: none; }
.nextbtn { width: 100%; font-size: 26px; padding: 18px; }

/* 글자·낱말 맞추기 */
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.slot { min-width: 52px; height: 62px; border-radius: 14px; border: 3px dashed var(--main2); background: var(--soft); display: grid; place-items: center; font-size: 38px; padding: 0 6px; }
.slots.words .slot { min-width: 64px; height: 50px; font-size: 24px; padding: 0 10px; }
.slot.filled { border-style: solid; border-color: var(--main); background: #fff; }
.slot.good { border: 3px solid var(--good); background: #e3f9ec; color: var(--good); }
.slot.reveal { border: 3px solid var(--bad); background: #ffeceb; color: var(--bad); }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.tile { min-width: 60px; height: 64px; border-radius: 16px; font-size: 34px; padding: 0 12px; background: #fff; box-shadow: 0 5px 0 var(--line); border: 3px solid var(--main2); }
.tiles.words .tile { font-size: 22px; height: 54px; min-width: 70px; }
.tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.tile.used { visibility: hidden; }
.tilebar { display: flex; justify-content: center; margin-top: 14px; }

/* 알파벳 줄 · 전치사 장면 */
.abcrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; font-size: 18px; }
.abcrow span { background: #fff; border-radius: 6px; padding: 0 5px; }
.abcrow span.hl { background: #ffe066; }
.seqrow { display: flex; gap: 10px; font-size: clamp(44px, 12vw, 64px); justify-content: center; }
.dots { font-size: 26px; letter-spacing: 3px; color: var(--main); max-width: 260px; }
.scene { position: relative; width: 220px; height: 170px; margin: 0 auto; }
.scene .o { position: absolute; line-height: 1; }
.scene .box { font-size: 76px; left: 72px; top: 50px; z-index: 2; }
.scene .t { font-size: 46px; z-index: 3; }
.scene .p-on { left: 88px; top: -4px; }
.scene .p-under { left: 88px; top: 124px; }
.scene .p-in { left: 94px; top: 72px; font-size: 32px; }
.scene .p-next { left: 160px; top: 76px; }
.scene .p-behind { left: 118px; top: 30px; font-size: 40px; z-index: 1; }
.scene .p-front { left: 58px; top: 84px; font-size: 60px; z-index: 4; }
.scene .floor { position: absolute; left: 10px; right: 10px; top: 124px; border-top: 3px solid #e3e8f2; z-index: 0; }

/* ---------- 결과 / 스티커 / 단어장 ---------- */
.result { text-align: center; padding-top: 40px; }
.result .re { font-size: 90px; animation: bob 2s ease-in-out infinite; }
.result h2 { font-size: 32px; margin: 8px 0; font-weight: normal; }
.result .stars { font-size: 64px; letter-spacing: 6px; color: #ffc107; }
.result .stars span { display: inline-block; animation: starIn .5s ease backwards; }
.result .stars .off { color: #dde1ea; }
.result p { font-size: 20px; margin: 8px 0; }
.result .bigscore { font-size: 72px; color: var(--main); }
.newsticker { margin: 18px auto; background: #fff; border-radius: 24px; padding: 14px 20px; display: inline-block; box-shadow: 0 6px 0 var(--main2); font-size: 20px; }
.newsticker span { font-size: 56px; display: inline-block; animation: spinIn .8s ease backwards; margin: 0 4px; }
.result .acts { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 22px auto 0; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.sgrid div { background: #fff; border-radius: 18px; aspect-ratio: 1; display: grid; place-items: center; font-size: 42px; box-shadow: 0 4px 0 var(--line); }
.sgrid div.no { font-size: 26px; color: #c9cede; background: #f6f7fb; }
.wbook { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.wbook button { background: #f1f3f8; border-radius: 14px; padding: 8px 4px; font-size: 16px; line-height: 1.25; }
.wbook button .we { display: block; font-size: 30px; }
.wbook button small { display: block; color: var(--muted); font-size: 12px; }
.wbook .g1 { background: #d3f9d8; }
.wbook .g2 { background: #8ce99a; }
.wbook .y { background: #fff3bf; }
.wbook .r { background: #ffc9c9; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 14px; color: var(--muted); margin: 10px 0; }
.legend span::before { content: ''; display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 4px; vertical-align: -2px; background: var(--c); }
.factmsg { text-align: center; font-size: 24px; min-height: 44px; margin: 6px 0 12px; }
.panel { background: #fff; border-radius: 24px; padding: 16px; box-shadow: 0 6px 0 var(--line); }

/* ---------- 효과 ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.cf { position: absolute; top: -50px; animation: fall linear forwards; }
.shake { animation: shake .4s ease; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-6px); } }
@keyframes glow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--main) 40%, transparent); } to { box-shadow: 0 0 0 10px color-mix(in srgb, var(--main) 10%, transparent); } }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes spinIn { from { transform: scale(0) rotate(-360deg); } to { transform: scale(1) rotate(0); } }

@media (max-width: 480px) {
  .track-card .te { font-size: 50px; }
  .track-card h2 { font-size: 23px; }
  .levels { grid-template-columns: 1fr 1fr; }
  .lv { flex-direction: column; text-align: center; padding: 12px 8px; gap: 4px; }
  .lv .lt { font-size: 17px; }
  .tile { min-width: 50px; height: 56px; font-size: 28px; }
  .slot { min-width: 44px; height: 54px; font-size: 32px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>

<script>
'use strict';
/* =========================================================
   재미있는 영어놀이
   - 7살: 영어 첫걸음 (알파벳 · 파닉스 · 그림 단어 · 색깔 · 숫자 · 단어 만들기)
   - 10살: 영어 챌린지 (중1 수준 어휘 · 철자 · 반대말 · be동사 · 3인칭 · 과거형
           · 의문사 · 전치사 · 조동사/진행형 · 문장 배열 · 생활 회화)
           + 스페셜 60초 도전 (어른도 함께! 고급 어휘 + 문법)
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
// 정답 + 후보에서 겹치지 않게 골라 n개 보기 만들기
function opts(ans, pool, n = 4) {
  const out = [ans];
  for (const c of pool) { if (out.length >= n) break; if (c && !out.includes(c)) out.push(c); }
  return shuffle(out);
}
const GAP = '<span class="gap">?</span>';
const withGap = (s) => s.replace('___', GAP);

const PRAISE = ['Great! 🎉', 'Excellent! 🌟', 'Good job! 👍', 'Perfect! 💯', 'Wonderful! ✨', '딩동댕! 🎉', '최고야! 👏', 'Super! 😄'];
const RETRY = ['아깝다! 다시 생각해 볼까? 💪', '괜찮아, 한 번 더! 🙂', '힌트를 보고 다시 해 봐요 🤔'];

/* ---------- 7살 단어 ---------- */

let actx = null;
function tone(freq, dur, type = 'sine', when = 0, vol = 0.15) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) { /* 소리 없이 진행 */ }
}

// 영어 원어민 음성을 우선 고름 (고품질 Natural/Google 음성 우선)
let enVoice = null;
function pickEnVoice() {
  if (enVoice) return enVoice;
  const all = speechSynthesis.getVoices(), en = all.filter((x) => /^en([-_]|$)/i.test(x.lang));
  if (!en.length) return null;
  const score = (x) => {
    const n = x.name; let s = 0;
    if (/natural|online|neural/i.test(n)) s += 40;
    if (/google/i.test(n)) s += 30;
    if (/aria|jenny|ava|samantha|allison|emma|guy|zira/i.test(n)) s += 15;
    if (/^en[-_]US$/i.test(x.lang)) s += 10; else if (/^en[-_]GB$/i.test(x.lang)) s += 6;
    if (x.localService) s += 1;
    return s;
  };
  enVoice = en.sort((a, b) => score(b) - score(a))[0];
  return enVoice;
}
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.addEventListener?.('voiceschanged', () => { enVoice = null; });
}

/* ---------- 플레이 ---------- */
function startLevel(tid, lid) {
  const T = TRACKS[tid], time = lid === 'time' || lid === 'special';
  const level = lid === 'special' ? SPECIAL : lid === 'time' ? null : lid === 'weak' ? WEAK : T.levels.find((l) => l.id === lid);
  play = { tid, lid, level, time, idx: 0, total: time ? Infinity : 10, results: [], mistakes: 0, combo: 0, maxCombo: 0, score: 0, firstOk: 0, recent: [], times: [] };
  view = { name: 'play', t: tid };
  document.body.className = 't-' + tid;
  renderPlayShell();
  newQ();
  if (time) {
    const p = play; p.end = Date.now() + 60000;
    p.timer = setInterval(() => {
      if (play !== p) return clearInterval(p.timer);
      const left = Math.max(0, (p.end - Date.now()) / 1000);
      const fill = $('#tfill'); if (fill) fill.style.width = (left / 60) * 100 + '%';
      const tl = $('#tleft'); if (tl) tl.textContent = Math.ceil(left);
      if (left <= 0) { clearInterval(p.timer); finish(); }
    }, 100);
  }
}
function timeLevels(tid) {
  const L = TRACKS[tid].levels, out = [];
  L.forEach((l, i) => { if (unlocked(tid, i) && !l.special) out.push(l); });
  return out;
}
// 최근에 푼 문제는 피하고, 안 풀어 본 문제(없으면 가장 오래전에 푼 문제)를 고른다.
function pickFresh(make, bucketId, recent, keep) {
  S.seen = S.seen || {}; S.seenN = S.seenN || 0;
  const b = S.seen[bucketId] = S.seen[bucketId] || {};
  let best = null, bestScore = Infinity;
  for (let k = 0; k < 40; k++) {
    const q = make();
    if (recent.includes(q.key)) { if (!best) best = q; continue; }
    const sc = b[q.key] === undefined ? -1 : b[q.key];
    if (sc < bestScore) { best = q; bestScore = sc; if (sc === -1) break; }
  }
  recent.push(best.key); if (recent.length > keep) recent.shift();
  b[best.key] = ++S.seenN;
  const keys = Object.keys(b);
  if (keys.length > 500) keys.sort((x, y) => b[x] - b[y]).slice(0, 120).forEach((x) => delete b[x]);
  save();
  return best;
}
function genQ() {
  const p = play;
  if (p.lid === 'weak') return pickFresh(() => weakGen(p.tid), `${p.tid}:weak`, p.recent, 4);
  return pickFresh(() => (p.level || pick(timeLevels(p.tid))).gen(), `${p.tid}:${p.lid}`, p.recent, 8);
}

function renderPlayShell() {
  const p = play;
  const title = p.lid === 'special' ? '🌟 60초 도전 (스페셜)' : p.time ? '⏱️ 60초 도전' : `${p.level.emoji} ${p.level.title}`;
  app.innerHTML = `<div class="screen play">
    <div class="topbar"><button class="icon" data-act="quit">✕</button><div class="ttl">${title}</div>
      <button class="icon" data-act="sound">${S.sound ? '🔔' : '🔕'}</button></div>
    ${p.time
      ? `<div class="timebox"><div class="timebar"><div id="tfill"></div></div><div class="tn">⏰<span id="tleft">60</span> · ⭐<span id="score">0</span></div></div>`
      : '<div class="path" id="path"></div>'}
    <div class="qcard" id="qcard"></div>
    <div class="answer" id="answer"></div>
  </div>`;
}
function renderPath() {
  const p = play, el = $('#path');
  if (!el) return;
  const T = TRACKS[p.tid];
  let h = '';
  for (let i = 0; i < p.total; i++) {
    const done = i < p.idx;
    h += `<span class="step ${done ? 'done' : ''} ${i === p.idx ? 'cur' : ''}">${done ? (p.results[i] ? '⭐' : '🌱') : ''}${i === p.idx ? `<span class="runner">${T.emoji}</span>` : ''}</span>`;
  }
  el.innerHTML = h + `<span class="goal">${T.goal}</span>`;
}
function choiceHTML(q, v) {
  if (q.cstyle === 'emoji') return v;
  if (q.cstyle === 'swatch') return `<span class="sw" style="background:${COLOR_CSS[v]}"></span>`;
  return `<span class="${/[a-zA-Z]/.test(v) ? 'en' : ''}">${v}</span>`;
}
function newQ() {
  const p = play, q = genQ();
  Object.assign(p, { q, tries: 0, picked: [], locked: false, qStart: Date.now() });
  renderPath();
  const listenOnly = q.listen && !q.visual;
  $('#qcard').innerHTML = `
    ${q.hint && !p.time ? '<button class="hintbtn" data-act="hint">💡 힌트</button>' : ''}
    <div class="qtext">${q.prompt || ''}</div>
    <div class="visual">${q.visual || ''}</div>
    ${q.listen ? `<button class="listen ${listenOnly ? 'big' : ''}" data-act="listen">🔊 ${listenOnly ? '소리 듣기' : '다시 듣기'}</button>` : ''}
    ${q.build ? `<div class="slots ${q.build.sep ? 'words' : ''}" id="slots"></div>` : ''}
    <div class="hintbox" id="hint" hidden></div>
    <div class="feedback" id="fb"></div>`;
  renderAnswer();
  if (q.listen && (S.auto || listenOnly)) later(() => sayQ(q), 250);
}
function sayQ(q) { speakEn(q.letter ? q.listen + '.' : q.listen, play && play.tid); }
function renderAnswer() {
  const p = play, q = p.q, el = $('#answer');
  if (q.build) {
    el.innerHTML = `<div class="tiles ${q.build.sep ? 'words' : ''}">${q.build.tiles.map((t, i) => `<button class="tile en ${p.picked.includes(i) ? 'used' : ''}" data-act="tile" data-i="${i}">${t}</button>`).join('')}</div>
      <div class="tilebar"><button class="btn ghost" data-act="undo">⌫ 하나 지우기</button></div>`;
    renderSlots();
    return;
  }
  el.innerHTML = `<div class="choices ${q.cstyle === 'sentence' ? 'one' : ''}">${q.choices.map((c, i) => `<button class="choice c${i} cs-${q.cstyle || 'word'}" data-act="choose" data-i="${i}">${choiceHTML(q, c)}</button>`).join('')}</div>`;
}
function renderSlots(cls) {
  const p = play, q = p.q, el = $('#slots');
  if (!el) return;
  const toks = cls === 'reveal' || cls === 'good' ? q.build.tokens : p.picked.map((i) => q.build.tiles[i]);
  el.innerHTML = q.build.tokens.map((_, k) => `<span class="slot en ${toks[k] ? 'filled' : ''} ${cls || ''}">${toks[k] || ''}</span>`).join('');
}
function fillGap(cls) { const g = $('#qcard .gap'); if (g) { g.textContent = play.q.ans; g.classList.add(cls); } }
function fb(html, cls) { const el = $('#fb'); if (el) { el.className = 'feedback ' + cls; el.innerHTML = html; } }
function showHint() { const q = play.q, h = $('#hint'); if (h && q.hint) { h.innerHTML = q.hint; h.hidden = false; } const b = $('.hintbtn'); if (b) b.remove(); }
function later(fn, ms) { const p = play; setTimeout(() => { if (play === p) fn(); }, ms); }
function showNext() {
  const q = play.q;
  if (q.explain) { const h = $('#hint'); h.innerHTML = q.explain; h.hidden = false; }
  $('#answer').innerHTML = '<button class="btn nextbtn" data-act="next">다음 ▶</button>';
}

function onTile(i) {
  const p = play;
  if (!p || p.locked || p.picked.includes(i)) return;
  sfx.tap();
  p.picked.push(i);
  const btn = document.querySelector(`.tile[data-i="${i}"]`); if (btn) btn.classList.add('used');
  renderSlots();
  const q = p.q;
  if (p.picked.length === q.build.tokens.length) {
    const got = p.picked.map((k) => q.build.tiles[k]);
    if (got.join(q.build.sep) === q.build.tokens.join(q.build.sep)) onCorrect(); else onWrong();
  }
}
function onUndo() { const p = play; if (!p || p.locked || !p.picked.length) return; sfx.tap(); p.picked.pop(); renderAnswer(); }
function submit(i, btn) {
  const p = play;
  if (!p || p.locked) return;
  if (p.q.choices[i] === p.q.ans) onCorrect(btn); else onWrong(btn);
}
function onCorrect(btn) {
  const p = play, q = p.q;
  p.locked = true; sfx.ok();
  if (btn) btn.classList.add('rightc');
  const first = p.tries === 0;
  p.results[p.idx] = first;
  if (q.word && first) { recordWord(p.tid, q.word, true); save(); }
  if (first) { p.firstOk++; p.combo++; p.maxCombo = Math.max(p.maxCombo, p.combo); }
  fillGap('good');
  if (q.build) renderSlots('good');
  const say = q.sayAfter || q.listen || (q.build ? q.build.tokens.join(q.build.sep) : '');
  const sec = (Date.now() - p.qStart) / 1000;
  p.times.push(sec);
  let msg = pick(PRAISE) + ` <span class="sec ${sec < 3 ? 'fast' : ''}">${sec < 3 ? '⚡' : '⏱️'} ${sec.toFixed(1)}초</span>`;
  if (first && p.combo >= 3) msg += ` <span class="combo">🔥 ${p.combo}연속!</span>`;
  confetti(first && p.combo >= 3 ? 14 : 6);
  if (p.time) {
    const pts = (q.pts || 1) + (p.combo >= 5 ? 1 : 0);
    p.score += pts; const s = $('#score'); if (s) s.textContent = p.score;
    msg += ` <span class="pts">+${pts}점</span>`;
    fb(msg, 'good'); later(nextQ, 550); return;
  }
  if (say) speakEn(say, p.tid);
  fb(msg, 'good');
  later(nextQ, say.length > 14 ? 2300 : 1400);
}
function onWrong(btn) {
  const p = play, q = p.q;
  sfx.bad(); p.combo = 0; shake($('#qcard'));
  if (btn) { btn.classList.add('wrongc'); btn.disabled = true; }
  if (q.word && p.tries === 0) { recordWord(p.tid, q.word, false); save(); }
  if (p.time) {
    p.locked = true; fillGap('reveal'); if (q.build) renderSlots('reveal');
    fb(`정답은 <b class="en">${q.build ? q.build.tokens.join(q.build.sep) : q.ans}</b>`, 'bad');
    later(nextQ, 1100); return;
  }
  p.tries++;
  if (p.tries === 1) {
    p.mistakes++;
    fb(pick(RETRY), 'bad'); showHint();
    if (q.build) { p.locked = true; later(() => { p.picked = []; p.locked = false; renderAnswer(); }, 700); }
    return;
  }
  p.locked = true; p.results[p.idx] = false;
  fillGap('reveal');
  if (q.build) renderSlots('reveal');
  else document.querySelectorAll('.choice').forEach((b, i) => { if (q.choices[i] === q.ans) b.classList.add('rightc'); });
  const say = q.sayAfter || q.listen || (q.build ? q.build.tokens.join(q.build.sep) : '');
  if (say) speakEn(say, p.tid);
  fb('정답을 확인해요. 다음엔 꼭 맞힐 수 있어! 💪', 'bad');
  showNext();
}
function nextQ() {
  const p = play;
  p.idx++;
  if (!p.time && p.idx >= p.total) return finish();
  newQ();
}
function finish() {
  const p = play, T = S.tracks[p.tid];
  if (p.timer) clearInterval(p.timer);
  const r = { tid: p.tid, lid: p.lid, time: p.time, score: p.score, firstOk: p.firstOk, total: p.total, maxCombo: p.maxCombo, avg: p.times.length ? p.times.reduce((a, b) => a + b, 0) / p.times.length : 0, fastest: p.times.length ? Math.min(...p.times) : 0, stickers: [], stars: 0, newBest: false };
  if (p.time) {
    const bk = p.lid === 'special' ? 'sbest' : 'best';
    if (p.score > (T[bk] || 0)) { r.newBest = true; T[bk] = p.score; if (p.score >= 8) r.stickers.push(award(p.tid)); }
    if (p.lid === 'special') { r.stars = p.score >= 25 ? 3 : p.score >= 12 ? 2 : 1; T.stars.special = Math.max(T.stars.special || 0, r.stars); }
  } else {
    r.stars = p.mistakes <= 1 ? 3 : p.mistakes <= 3 ? 2 : 1;
    const prev = T.stars[p.lid] || 0;
    if (p.lid !== 'weak') T.stars[p.lid] = Math.max(prev, r.stars);
    r.stickers.push(award(p.tid));
    if (r.stars === 3 && prev < 3 && p.lid !== 'weak') r.stickers.push(award(p.tid));
    const L = TRACKS[p.tid].levels, i = L.findIndex((l) => l.id === p.lid);
    r.next = i >= 0 && i < L.length - 1 ? L[i + 1].id : null;
    r.unlockedNew = r.next && prev === 0 && !L[i + 1].special && !L[i + 1].free;
  }
  r.stickers = r.stickers.filter(Boolean);
  save(); sfx.win(); confetti(50);
  play = null;
  view = { name: 'result', t: r.tid, r };
  render();
}
function renderResult() {
  const r = view.r, T = TRACKS[r.tid];
  document.body.className = 't-' + r.tid;
  const lvTitle = r.lid === 'special' ? '60초 도전 (스페셜)' : r.time ? '60초 도전' : r.lid === 'weak' ? WEAK.title : T.levels.find((l) => l.id === r.lid).title;
  const msgs = { 3: 'Perfect! 영어 왕이에요 👑', 2: 'Great job! 조금만 더 하면 별 3개! 💪', 1: 'Good try! 다시 하면 더 잘할 거예요 😊' };
  app.innerHTML = `<div class="screen result">
    <div class="re">${r.time ? '⏱️' : r.stars === 3 ? '🏆' : '🎉'}</div>
    <h2>${lvTitle} ${r.time ? '끝!' : '완료!'}</h2>
    ${r.time
      ? `<div class="bigscore">${r.score}점</div><p>${r.newBest ? '🎊 새로운 최고 기록이에요!' : `최고 기록: ${S.tracks[r.tid][r.lid === 'special' ? 'sbest' : 'best'] || 0}점`}</p>${r.lid === 'special' ? `<div class="stars">${[1, 2, 3].map((k) => `<span class="${k <= r.stars ? '' : 'off'}" style="animation-delay:${k * 0.25}s">★</span>`).join('')}</div><p style="font-size:16px;color:var(--muted)">문법·반대말·회화 1점 · 고급 어휘 2점 · 5연속부터 +1점<br>⭐ 12점 이상 별 2개 · 25점 이상 별 3개</p>` : ''}<p>최고 연속 정답 🔥 ${r.maxCombo}</p>`
      : `<div class="stars">${[1, 2, 3].map((k) => `<span class="${k <= r.stars ? '' : 'off'}" style="animation-delay:${k * 0.25}s">★</span>`).join('')}</div>
         <p>${msgs[r.stars]}</p><p>한 번에 맞힌 문제 ${r.firstOk} / ${r.total} · 최고 연속 🔥 ${r.maxCombo}</p>
         ${r.unlockedNew ? '<p>🔓 다음 단계가 열렸어요!</p>' : ''}`}
    ${r.avg ? `<p>⏱️ 평균 ${r.avg.toFixed(1)}초 · ⚡ 가장 빨리 ${r.fastest.toFixed(1)}초</p>` : ''}
    ${r.stickers.length ? `<div class="newsticker">새 스티커를 받았어요!<br>${r.stickers.map((s) => `<span>${s}</span>`).join('')}</div>` : ''}
    <div class="acts">
      ${r.next ? `<button class="btn" data-act="start" data-l="${r.next}">다음 단계로 ▶</button>` : ''}
      <button class="btn ${r.next ? 'ghost' : ''}" data-act="start" data-l="${r.lid}">🔁 다시 하기</button>
      <button class="btn ghost" data-act="levels">📋 단계 고르기</button>
    </div>
  </div>`;
}

/* ---------- 입력 처리 ---------- */
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, t = el.dataset.t;
  switch (act) {
    case 'rename': {
      e.stopPropagation();
      const n = prompt(`${TRACKS[t].age} 친구의 이름을 알려 주세요`, S.tracks[t].name);
      if (n !== null) { S.tracks[t].name = n.trim().slice(0, 8); save(); render(); }
      return;
    }
    case 'track': sfx.tap(); go({ name: 'levels', t }); return;
    case 'home': go({ name: 'home' }); return;
    case 'levels': case 'back': go({ name: 'levels', t: view.t }); return;
    case 'sound': S.sound = !S.sound; save(); el.textContent = S.sound ? '🔔' : '🔕'; sfx.tap(); return;
    case 'stickers': go({ name: 'stickers', t: view.t }); return;
    case 'book': go({ name: 'book', t: view.t }); return;
    case 'auto': S.auto = el.dataset.v === '1'; save(); render(); return;
    case 'slow': S.slow[view.t] = el.dataset.v === '1'; save(); render(); speakEn('Hello!', view.t); return;
    case 'open': S.tracks[view.t].open = el.dataset.v === '1'; save(); render(); return;
    case 'start':
      if (el.dataset.locked) { shake(el); sfx.bad(); return; }
      sfx.tap(); startLevel(view.t, el.dataset.l); return;
    case 'word': {
      const w = TRACKS[view.t].pool[+el.dataset.i], v = S.tracks[view.t].words[w.en];
      $('#factmsg').innerHTML = `${w.e || ''} <b class="en">${w.en}</b> = ${w.ko} <small style="font-size:15px;color:var(--muted)">${v ? `(맞힘 ${v.ok} · 틀림 ${v.bad})` : ''}</small>`;
      speakEn(w.en, view.t);
      return;
    }
    case 'quit':
      if (play && (play.time || play.idx > 0) && !confirm('그만하고 나갈까요?')) return;
      go({ name: 'levels', t: view.t }); return;
    case 'listen': if (play) sayQ(play.q); return;
    case 'hint': showHint(); return;
    case 'choose': if (play && !play.locked) submit(+el.dataset.i, el); return;
    case 'tile': onTile(+el.dataset.i); return;
    case 'undo': onUndo(); return;
    case 'next': if (play) nextQ(); return;
  }
});
document.addEventListener('keydown', (e) => {
  if (!play) return;
  if (play.locked) { if ((e.key === 'Enter' || e.key === ' ') && $('[data-act="next"]')) { e.preventDefault(); nextQ(); } return; }
  const q = play.q;
  if (e.key === ' ' && q.listen) { e.preventDefault(); sayQ(q); return; }
  if (q.build) {
    if (e.key === 'Backspace') { e.preventDefault(); onUndo(); return; }
    if (q.build.sep || e.key.length !== 1) return;
    const i = q.build.tiles.findIndex((t, k) => t.toLowerCase() === e.key.toLowerCase() && !play.picked.includes(k));
    if (i >= 0) onTile(i);
    return;
  }
  const i = '1234'.indexOf(e.key);
  if (i >= 0) { const b = document.querySelectorAll('.choice')[i]; if (b && !b.disabled) b.click(); }
});

render();
</script>
</body>
</html>
