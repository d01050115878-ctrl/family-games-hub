<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#e8590c">
<title>재미있는 한자놀이 🀄</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='90'>🀄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2b2d42; --muted: #7a7f99; --line: #e6e8f0;
  --good: #2fb36d; --bad: #ff5a5f;
  --main: #e8590c; --main2: #ffa94d; --soft: #fff0e0;
  --hanja: 'Noto Serif KR', 'Batang', 'Malgun Gothic', serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  background: linear-gradient(160deg, #fff4e6 0%, #fff9db 45%, #ebfbee 100%) fixed;
  color: var(--ink); min-height: 100vh; overflow-x: hidden;
  user-select: none; -webkit-user-select: none;
}
button { font-family: inherit; cursor: pointer; border: 0; color: inherit; }
b { font-weight: normal; color: var(--main); }
.hz { font-family: var(--hanja); font-weight: 700; }
.screen { max-width: 760px; margin: 0 auto; padding: 16px 16px 32px; min-height: 100vh; }

.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.topbar .ttl { flex: 1; font-size: 20px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon { width: 46px; height: 46px; border-radius: 14px; background: #fff; font-size: 22px; box-shadow: 0 3px 0 var(--line); flex: none; text-decoration: none; display: grid; place-items: center; }
.icon:active { transform: translateY(2px); box-shadow: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 22px; border-radius: 18px; font-size: 20px; background: var(--main); color: #fff; box-shadow: 0 5px 0 #b8460a; text-decoration: none; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8460a; }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--line); }
.btn.green { background: var(--good); box-shadow: 0 5px 0 #1f8a51; }

/* 홈 */
.hero { text-align: center; margin: 10px 0 18px; }
.hero .logo { font-size: 72px; animation: bob 2.4s ease-in-out infinite; line-height: 1; }
.hero h1 { font-size: 34px; margin: 8px 0 4px; font-weight: normal; }
.hero p { margin: 0; color: var(--muted); font-size: 17px; }
.who { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 16px; box-shadow: 0 3px 0 var(--line); }
.grades { display: grid; gap: 12px; }
.grade { --c: #e8590c; display: flex; align-items: center; gap: 16px; text-align: left; background: #fff; border-radius: 24px; padding: 16px 18px; box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 45%, #fff); border: 3px solid color-mix(in srgb, var(--c) 30%, #fff); }
.grade:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 45%, #fff); }
.grade .gb { flex: none; width: 76px; height: 76px; border-radius: 22px; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 26px; line-height: 1; text-align: center; }
.grade .gb small { display: block; font-size: 13px; opacity: .9; margin-top: 2px; }
.grade h2 { margin: 0; font-size: 23px; font-weight: normal; }
.grade p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
.grade .sample { font-size: 24px; margin-top: 4px; letter-spacing: 4px; color: var(--ink); }
.grade .gs { margin-left: auto; text-align: right; font-size: 15px; color: #f59f00; white-space: nowrap; }
.foot { display: flex; justify-content: center; margin-top: 24px; }

/* 급 화면 */
.ghead { background: #fff; border-radius: 24px; padding: 18px; text-align: center; box-shadow: 0 6px 0 var(--main2); margin-bottom: 14px; }
.ghead h2 { margin: 4px 0; font-size: 26px; font-weight: normal; }
.ghead p { margin: 0; color: var(--muted); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.game { text-align: left; background: #fff; border-radius: 22px; padding: 16px; box-shadow: 0 5px 0 var(--line); display: flex; gap: 12px; align-items: center; }
.game:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.game .ge { font-size: 40px; flex: none; }
.game h3 { margin: 0; font-size: 20px; font-weight: normal; }
.game p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.game .ls { font-size: 17px; color: #ffc107; margin-top: 3px; }
.off { color: #dde1ea !important; }

/* 공부 카드 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.hcard { background: #fff; border-radius: 18px; padding: 10px 6px 8px; text-align: center; box-shadow: 0 4px 0 var(--line); }
.hcard:active, .hcard.on { background: var(--soft); box-shadow: 0 4px 0 var(--main2); }
.hcard .h { font-size: 52px; line-height: 1.15; }
.hcard .m { font-size: 16px; color: var(--muted); }
.hcard.on .m { color: var(--main); }

/* 플레이 */
.play { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 16px; }
.path { display: flex; align-items: center; gap: 4px; background: #fff; border-radius: 999px; padding: 6px 10px; margin-bottom: 12px; }
.path .step { flex: 1; height: 28px; border-radius: 999px; background: #f1f3f8; display: grid; place-items: center; font-size: 14px; position: relative; }
.path .step.done { background: var(--soft); }
.path .step.cur { background: var(--main2); }
.path .runner { position: absolute; font-size: 24px; top: -8px; animation: hop .6s ease-in-out infinite alternate; }
.path .goal { font-size: 24px; flex: none; }
.qcard { background: #fff; border-radius: 28px; padding: 18px 14px 14px; box-shadow: 0 8px 0 var(--main2); text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; min-height: 250px; }
.qtext { font-size: 21px; line-height: 1.45; color: var(--muted); }
.bighz { font-size: clamp(110px, 34vw, 170px); line-height: 1.1; animation: pop .35s ease; }
.wordhz { font-size: clamp(56px, 16vw, 92px); line-height: 1.2; letter-spacing: 4px; animation: pop .35s ease; }
.meaning { font-size: clamp(40px, 11vw, 60px); color: var(--ink); }
.feedback { min-height: 30px; font-size: 22px; }
.feedback.good { color: var(--good); animation: pop .35s ease; }
.feedback.bad { color: var(--bad); }
.sec { display: inline-block; background: #e7f5ff; color: #1c7ed6; border-radius: 999px; padding: 0 10px; margin-left: 4px; }
.sec.fast { background: #fff3bf; color: #e67700; }
.combo { display: inline-block; background: #fff0e0; color: #ff6b00; border-radius: 999px; padding: 0 10px; margin-left: 4px; }
.explain { font-size: 19px; line-height: 1.6; background: #fff8e1; border-radius: 16px; padding: 10px 14px; }

.answer { margin-top: 14px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { font-size: clamp(24px, 7vw, 36px); padding: 18px 6px; border-radius: 22px; color: #fff; line-height: 1.15; }
.choice.hz { font-size: clamp(40px, 12vw, 60px); padding: 10px 6px; }
.choice.c0 { background: #ff6b6b; box-shadow: 0 6px 0 #d94848; }
.choice.c1 { background: #4dabf7; box-shadow: 0 6px 0 #2f87d1; }
.choice.c2 { background: #51cf66; box-shadow: 0 6px 0 #34a84a; }
.choice.c3 { background: #b197fc; box-shadow: 0 6px 0 #8c6fe0; }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.choice:disabled { opacity: .3; transform: scale(.94); }
.choice.rightc { outline: 5px solid var(--good); outline-offset: 3px; }
.nextbtn { width: 100%; font-size: 26px; padding: 18px; }

/* 짝 맞추기 */
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.mcard { background: #fff; border: 3px solid #ffd8a8; border-radius: 18px; min-height: 86px; display: grid; place-items: center; font-size: 20px; box-shadow: 0 5px 0 #ffd8a8; padding: 4px; }
.mcard.hz { font-size: 46px; }
.mcard.sel { background: #fff3bf; border-color: #fab005; transform: translateY(-3px); }
.mcard.done { background: #e3f9ec; border-color: var(--good); box-shadow: none; opacity: .45; pointer-events: none; }
.mcard.no { background: #ffeceb; border-color: var(--bad); }

/* 따라쓰기 */
.tinfo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; }
.board { position: relative; width: 100%; }
.board canvas { display: block; width: 100%; height: auto; border-radius: 20px; }
.board canvas.ink { position: absolute; inset: 0; touch-action: none; cursor: crosshair; }
.tbtns { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
.tbtns .btn { font-size: 22px; padding: 16px; }
.colors { display: flex; justify-content: center; gap: 10px; }
.colors button { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.colors button.on { outline: 4px solid var(--ink); outline-offset: 2px; }

/* 결과 / 스티커 */
.result { text-align: center; padding-top: 40px; }
.result .re { font-size: 90px; animation: bob 2s ease-in-out infinite; }
.result h2 { font-size: 30px; margin: 8px 0; font-weight: normal; }
.result .stars { font-size: 64px; letter-spacing: 6px; color: #ffc107; }
.result .stars span { display: inline-block; animation: starIn .5s ease backwards; }
.result p { font-size: 20px; margin: 8px 0; }
.newsticker { margin: 16px auto; background: #fff; border-radius: 24px; padding: 14px 20px; display: inline-block; box-shadow: 0 6px 0 var(--main2); font-size: 20px; }
.newsticker span { font-size: 56px; display: inline-block; animation: spinIn .8s ease backwards; margin: 0 4px; }
.acts { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 22px auto 0; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.sgrid div { background: #fff; border-radius: 18px; aspect-ratio: 1; display: grid; place-items: center; font-size: 42px; box-shadow: 0 4px 0 var(--line); }
.sgrid div.no { font-size: 26px; color: #c9cede; background: #f6f7fb; }

#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.cf { position: absolute; top: -50px; animation: fall linear forwards; }
.shake { animation: shake .4s ease; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-6px); } }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes spinIn { from { transform: scale(0) rotate(-360deg); } to { transform: scale(1) rotate(0); } }
@media (max-width: 480px) {
  .games { grid-template-columns: 1fr 1fr; gap: 10px; }
  .game { flex-direction: column; text-align: center; padding: 14px 8px; gap: 4px; }
  .grade { padding: 14px; gap: 12px; }
  .grade .gb { width: 64px; height: 64px; font-size: 22px; }
  .grade .sample { font-size: 20px; letter-spacing: 2px; }
  .mcard { min-height: 74px; font-size: 18px; }
  .mcard.hz { font-size: 40px; }
}
</style>
</head>

<div id="app"></div>

    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) { /* 소리 없이 */ }
}

function pickFresh(make, bucketId, recent, keep) {
  S.seen = S.seen || {}; S.seenN = S.seenN || 0;
  const b = S.seen[bucketId] = S.seen[bucketId] || {};
  let best = null, bestScore = Infinity;
  for (let k = 0; k < 40; k++) {
    const q = make();
    if (recent.includes(q.key)) { if (!best) best = q; continue; }
    const sc = b[q.key] === undefined ? -1 : b[q.key];
    if (sc < bestScore) { best = q; bestScore = sc; if (sc === -1) break; }
  }
  recent.push(best.key); if (recent.length > keep) recent.shift();
  b[best.key] = ++S.seenN;
  const keys = Object.keys(b);
  if (keys.length > 400) keys.sort((x, y) => b[x] - b[y]).slice(0, 100).forEach((x) => delete b[x]);
  save();
  return best;
}

  return ` <span class="sec ${sec < 3 ? 'fast' : ''}">${sec < 3 ? '⚡' : '⏱️'} ${sec.toFixed(1)}초</span>`;
}
function markCorrect() {
  const p = play, first = p.tries === 0;
  p.locked = true; p.results[p.idx] = first; sfx.ok();
  if (first) { p.firstOk++; p.combo++; p.maxCombo = Math.max(p.maxCombo, p.combo); }
  let msg = pick(PRAISE) + timeTag();
  if (first && p.combo >= 3) msg += ` <span class="combo">🔥 ${p.combo}연속!</span>`;
  confetti(first && p.combo >= 3 ? 14 : 6);
  return msg;
}
function showNextBtn() { $('#answer').innerHTML = '<button class="btn nextbtn" data-act="next">다음 ▶</button>'; }
function nextQ() { const p = play; p.idx++; if (p.idx >= p.total) return finish(); newQ(); }

function choose(i, btn) {
  const p = play, q = p.q;
  if (p.locked) return;
  if (q.choices[i] === q.ans) {
    btn.classList.add('rightc');
    fb(markCorrect(), 'good');
    speak(q.after);
    if (q.explain) { $('#fb').insertAdjacentHTML('afterend', q.explain); later(nextQ, 2300); return; }
    later(nextQ, 1300);
    return;
  }
  sfx.bad(); p.combo = 0; shake($('#qcard'));
  btn.disabled = true;
  p.tries++;
  if (p.tries === 1) { p.mistakes++; fb(pick(RETRY), 'bad'); return; }
  p.locked = true; p.results[p.idx] = false;
  document.querySelectorAll('.choice').forEach((b, k) => { if (q.choices[k] === q.ans) b.classList.add('rightc'); });
  fb(`정답은 <b class="${q.hzChoices ? 'hz' : ''}">${q.ans}</b> 이에요. 다음엔 꼭 맞힐 수 있어! 💪`, 'bad');
  if (q.explain) $('#fb').insertAdjacentHTML('afterend', q.explain);
  speak(q.after);
  showNextBtn();
}

/* ---------- 짝 맞추기 ---------- */
function matchQ() {
  const p = play, q = p.q;
  p.cards = shuffle([...q.set.map((c) => ({ k: c.h, t: c.h, hz: true })), ...q.set.map((c) => ({ k: c.h, t: c.mean }))]);
  p.sel = null; p.matched = 0;
  $('#qcard').innerHTML = `<div class="qtext">한자와 뜻·소리 카드의 짝을 찾아요!</div><div class="mgrid">${p.cards.map((c, i) => `<button class="mcard ${c.hz ? 'hz' : ''}" data-act="mcard" data-i="${i}">${c.t}</button>`).join('')}</div><div class="feedback" id="fb"></div>`;
  $('#answer').innerHTML = '';
}
function tapCard(i, el) {
  const p = play;
  if (p.locked || el.classList.contains('done') || p.busy) return;
  if (p.sel === null) { p.sel = i; el.classList.add('sel'); sfx.tap(); return; }
  if (p.sel === i) { p.sel = null; el.classList.remove('sel'); return; }
  const a = p.cards[p.sel], b = p.cards[i], elA = document.querySelector(`.mcard[data-i="${p.sel}"]`);
  if (a.k === b.k && a.hz !== b.hz) {
    sfx.ok(); elA.classList.remove('sel'); elA.classList.add('done'); el.classList.add('done');
    p.sel = null; p.matched++;
    speak(charInfo(a.k).mean);
    if (p.matched === p.q.set.length) { p.tries = p.boardMiss || 0; p.boardMiss = 0; fb(markCorrect(), 'good'); later(nextQ, 1500); }
    return;
  }
  sfx.bad(); p.mistakes++; p.combo = 0; p.boardMiss = (p.boardMiss || 0) + 1;
  el.classList.add('no'); elA.classList.add('no'); p.busy = true;
  setTimeout(() => { el.classList.remove('no'); elA.classList.remove('no', 'sel'); p.busy = false; }, 600);
  p.sel = null;
}

/* ---------- 따라쓰기 ---------- */
const CELL = 300, TFONT = "700 225px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
const PENS = ['#e8590c', '#4dabf7', '#51cf66', '#ff6b9a', '#9775fa'];
let pen = PENS[0];
function drawGlyph(ctx, t, color, strokeW) {
  ctx.font = TFONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineJoin = 'round'; ctx.lineWidth = strokeW || 1;
  ctx.fillText(t, CELL / 2, CELL * 0.52); if (strokeW) ctx.strokeText(t, CELL / 2, CELL * 0.52);
}
function drawGuide(ctx, t) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, CELL, CELL);
  ctx.strokeStyle = '#ffc9a8'; ctx.lineWidth = 4; ctx.setLineDash([]); ctx.strokeRect(6, 6, CELL - 12, CELL - 12);
  ctx.strokeStyle = '#ffe8d6'; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
  ctx.beginPath(); ctx.moveTo(CELL / 2, 12); ctx.lineTo(CELL / 2, CELL - 12); ctx.moveTo(12, CELL / 2); ctx.lineTo(CELL - 12, CELL / 2);
  ctx.moveTo(12, 12); ctx.lineTo(CELL - 12, CELL - 12); ctx.moveTo(CELL - 12, 12); ctx.lineTo(12, CELL - 12); ctx.stroke();
  ctx.setLineDash([]);
  drawGlyph(ctx, t, '#e9ecf2');
  ctx.setLineDash([8, 6]); ctx.lineWidth = 2.5; ctx.strokeStyle = '#aab3c5'; ctx.strokeText(t, CELL / 2, CELL * 0.52); ctx.setLineDash([]);
}
function drawStrokes(ctx, strokes, w) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = w; ctx.strokeStyle = '#000';
  for (const s of strokes) {
    ctx.beginPath(); ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]);
    for (const pt of s.pts) ctx.lineTo(pt[0], pt[1]);
    ctx.stroke();
  }
}
function traceQ() {
  const p = play, q = p.q;
  p.strokes = [];
  $('#qcard').innerHTML = `
    <div class="tinfo"><span>회색 한자를 따라 써요!</span> <b>${q.mean}</b></div>
    <div class="board" style="max-width:340px"><canvas id="guide" width="${CELL}" height="${CELL}"></canvas><canvas class="ink" id="ink" width="${CELL}" height="${CELL}"></canvas></div>
    <div class="colors">${PENS.map((c) => `<button style="background:${c}" class="${c === pen ? 'on' : ''}" data-act="pen" data-c="${c}"></button>`).join('')}</div>
    <div class="feedback" id="fb"></div>`;
  $('#answer').innerHTML = `<div class="tbtns"><button class="btn ghost" data-act="erase">🧽 지우기</button><button class="btn green" data-act="check">다 썼어요 ✔</button></div>`;
  const draw = () => drawGuide($('#guide').getContext('2d'), q.target);
  draw();
  if (document.fonts && document.fonts.load) document.fonts.load(TFONT, q.target).then(() => { if (play && play.q === q) draw(); }).catch(() => {});
  setupInk($('#ink'));
  speak(q.say);
}
function setupInk(cv) {
  const ctx = cv.getContext('2d');
  let cur = null;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', (e) => {
    if (!play || play.locked) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    cur = { pts: [pos(e)] }; play.strokes.push(cur);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = CELL * 0.06; ctx.strokeStyle = pen;
    ctx.beginPath(); ctx.moveTo(cur.pts[0][0], cur.pts[0][1]); ctx.lineTo(cur.pts[0][0] + 0.1, cur.pts[0][1]); ctx.stroke();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!cur) return;
    const a = cur.pts[cur.pts.length - 1], b = pos(e);
    cur.pts.push(b);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  });
  const end = () => { cur = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
/* 글자 모양의 뼈대(중심선) — Zhang-Suen 세선화 */
function skeleton(m, W, H) {
  const k = Uint8Array.from(m);
  let changed = true;
  while (changed) {
    changed = false;
    for (let pass = 0; pass < 2; pass++) {
      const del = [];
      for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
        const i = y * W + x; if (!k[i]) continue;
        const p2 = k[i - W], p3 = k[i - W + 1], p4 = k[i + 1], p5 = k[i + W + 1], p6 = k[i + W], p7 = k[i + W - 1], p8 = k[i - 1], p9 = k[i - W - 1];
        const b = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9; if (b < 2 || b > 6) continue;
        const a = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) + (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2);
        if (a !== 1) continue;
        if (pass === 0 ? (p2 * p4 * p6 || p4 * p6 * p8) : (p2 * p4 * p8 || p2 * p6 * p8)) continue;
        del.push(i);
      }
      if (del.length) { changed = true; for (const i of del) k[i] = 0; }
    }
  }

}
const skelCache = {};
function glyphInfo(t) {
  if (skelCache[t]) return skelCache[t];
  const W = CELL, H = CELL;
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d', { willReadFrequently: true }); };
  const g = mk(); drawGlyph(g, t, '#000');
  const gx = mk(); drawGlyph(gx, t, '#000', CELL * 0.06); // 글자 + 약 9px 여유
  const gd = g.getImageData(0, 0, W, H).data, gxd = gx.getImageData(0, 0, W, H).data;
  const m = new Uint8Array(W * H), near = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) { m[i] = gd[i * 4 + 3] > 128 ? 1 : 0; near[i] = gxd[i * 4 + 3] > 64 ? 1 : 0; }
  const k = skeleton(m, W, H), pts = [];
  for (let i = 0; i < W * H; i++) if (k[i]) pts.push(i);
  // 뼈대 각 점의 획 방향(주변 뼈대 점들의 주축)
  const ux = new Float32Array(W * H), uy = new Float32Array(W * H);
  for (const i of pts) {
    const x = i % W, y = (i - x) / W; let n = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
    for (let dy = -6; dy <= 6; dy++) for (let dx = -6; dx <= 6; dx++) {
      const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= W || yy >= H || !k[yy * W + xx]) continue;
      n++; sx += dx; sy += dy; sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
    }
    sx /= n; sy /= n; const a = 0.5 * Math.atan2(2 * (sxy / n - sx * sy), sxx / n - sx * sx - (syy / n - sy * sy));
    ux[i] = Math.cos(a); uy[i] = Math.sin(a);
  }
  // 각 픽셀에서 가장 가까운 뼈대 점 (16px 이내)
  const nearest = new Int32Array(W * H).fill(-1), dist = new Uint8Array(W * H);
  let q = pts.slice(); for (const i of q) nearest[i] = i;
  for (let d = 1; d <= 16 && q.length; d++) {
    const nq = [];
    for (const i of q) {
      const x = i % W;
      for (const o of [1, -1, W, -W, W + 1, W - 1, -W + 1, -W - 1]) {
        const j = i + o; if (j < 0 || j >= W * H || nearest[j] >= 0) continue;
        if (Math.abs((j % W) - x) > 1) continue;
        nearest[j] = nearest[i]; dist[j] = d; nq.push(j);
      }
    }
    q = nq;
  }
  return (skelCache[t] = { near, pts, ux, uy, nearest });
}
function scoreTrace() {
  const W = CELL, H = CELL, info = glyphInfo(play.q.target);
  // 1) 중심선 커버: 글자 뼈대가 내가 그은 선 근처(약 16px)에 있는가
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const cx = c.getContext('2d', { willReadFrequently: true });
  drawStrokes(cx, play.strokes, CELL * 0.11);
  const cd = cx.getImageData(0, 0, W, H).data;
  let hit = 0;
  for (const i of info.pts) if (cd[i * 4 + 3] > 0) hit++;
  // 2) 선 밖으로 나간 정도 / 3) 그은 길이(마구 칠하기·덧칠 방지)
  let len = 0, samples = 0, out = 0;
  const test = (x, y) => {
    samples++;
    const xi = Math.round(x), yi = Math.round(y);
    if (xi < 0 || yi < 0 || xi >= W || yi >= H || !info.near[yi * W + xi]) out++;
  };
  for (const s of play.strokes) {
    test(s.pts[0][0], s.pts[0][1]);
    for (let j = 1; j < s.pts.length; j++) {
      const a = s.pts[j - 1], b = s.pts[j], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      len += d;
      const n = Math.ceil(d / 2);
      for (let t = 1; t <= n; t++) test(a[0] + (b[0] - a[0]) * t / n, a[1] + (b[1] - a[1]) * t / n);
    }
  }
  // 4) 방향: 그은 선이 글자 획과 같은 방향으로 가는가 (동그라미·지그재그 방지)
  let aTot = 0, aOk = 0;
  for (const s of play.strokes) {
    let last = s.pts[0];
    for (const pt of s.pts) {
      const dx = pt[0] - last[0], dy = pt[1] - last[1], d = Math.hypot(dx, dy);
      if (d < 7) continue;
      const mx = Math.round((pt[0] + last[0]) / 2), my = Math.round((pt[1] + last[1]) / 2); last = pt;
      if (mx < 0 || my < 0 || mx >= W || my >= H) continue;
      const k = info.nearest[my * W + mx]; if (k < 0) continue;
      aTot += d; if (Math.abs(dx * info.ux[k] + dy * info.uy[k]) / d >= 0.7) aOk += d;
    }
  }
  const S = info.pts.length || 1;
  return { cov: hit / S, out: samples ? out / samples : 1, much: len / S, align: aTot ? aOk / aTot : 1 };
}
const TR = { cov: 0.88, out: 0.2, much: 1.9, align: 0.62 };
function checkTrace() {
  const p = play;
  if (p.locked) return;
  if (!p.strokes.length) { fb('먼저 손가락으로 따라 써 봐요! ✍️', 'bad'); shake($('.board')); return; }
  const r = scoreTrace();
  if (r.cov >= TR.cov && r.out <= TR.out && r.much <= TR.much && r.align >= TR.align) {
    let msg = markCorrect();
    if (r.cov >= 0.9 && r.out <= 0.08) msg = '💯 아주 멋지게 썼어요! ' + msg;
    fb(msg, 'good'); speak(p.q.say); showNextBtn(); return;
  }
  sfx.bad(); p.combo = 0; shake($('.board'));
  p.tries++;
  if (p.tries === 1) p.mistakes++;
  if (p.tries >= 3) { p.locked = true; p.results[p.idx] = false; fb('잘 했어요! 다음 한자도 해 봐요 💪' + timeTag(), 'good'); showNextBtn(); return; }
  fb(r.out > TR.out ? '선 밖으로 나갔어요. 회색 글자 위로만 따라 써 볼까요? 🧽' : r.much > TR.much || r.align < TR.align ? '마구 칠하지 말고 획을 따라 써 볼까요? 🧽' : '빠진 획이 있어요. 회색 한자를 끝까지 따라 써 볼까요? ✍️', 'bad');
}
function eraseTrace() {
  const p = play; if (!p || p.locked) return;
  p.strokes = []; const cv = $('#ink'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); fb('', '');
}

/* ---------- 결과 ---------- */
function finish() {
  const p = play, ratio = p.mistakes / p.total;
  const stars = p.g.stars ? p.g.stars(p.mistakes) : ratio <= 0.1 ? 3 : ratio <= 0.3 ? 2 : 1;
  const key = p.G.id + ':' + p.g.id, prev = S.stars[key] || 0;
  S.stars[key] = Math.max(prev, stars);
  const stickers = [award()];
  if (stars === 3 && prev < 3) stickers.push(award());
  save(); sfx.win(); confetti(50);
  const t = p.times;
  const r = { gid: p.G.id, game: p.g.id, stars, firstOk: p.firstOk, total: p.total, maxCombo: p.maxCombo, mistakes: p.mistakes, stickers: stickers.filter(Boolean),
    avg: t.length ? t.reduce((a, b) => a + b, 0) / t.length : 0, fastest: t.length ? Math.min(...t) : 0 };
  play = null; view = { name: 'result', g: r.gid, r }; render();
}
function renderResult() {
  const r = view.r, g = GAMES.find((x) => x.id === r.game);
  const msgs = { 3: '완벽해요! 한자 박사예요 👑', 2: '아주 잘했어요! 조금만 더 하면 별 3개! 💪', 1: '끝까지 해냈어요! 다시 하면 더 잘할 거예요 😊' };
  const gi = GRADES.findIndex((G) => G.id === r.gid), nextG = GRADES[gi + 1];
  app.innerHTML = `<div class="screen result">
    <div class="re">${r.stars === 3 ? '🏆' : '🎉'}</div>
    <h2>${r.gid}급 · ${g.title} 완료!</h2>
    <div class="stars">${[1, 2, 3].map((k) => `<span class="${k <= r.stars ? '' : 'off'}" style="animation-delay:${k * 0.25}s">★</span>`).join('')}</div>
    <p>${msgs[r.stars]}</p>
    <p>${g.type === 'match' ? `틀린 짝 ${r.mistakes}번` : `한 번에 맞힌 문제 ${r.firstOk} / ${r.total}`} · 최고 연속 🔥 ${r.maxCombo}</p>
    ${r.avg ? `<p>⏱️ 평균 ${r.avg.toFixed(1)}초 · ⚡ 가장 빨리 ${r.fastest.toFixed(1)}초</p>` : ''}
    ${r.stickers.length ? `<div class="newsticker">새 스티커를 받았어요!<br>${r.stickers.map((s) => `<span>${s}</span>`).join('')}</div>` : ''}
    <div class="acts">
      <button class="btn" data-act="start" data-game="${r.game}">🔁 다시 하기</button>
      <button class="btn ghost" data-act="back">📋 ${r.gid}급 놀이 고르기</button>
      ${nextG && r.stars === 3 ? `<button class="btn ghost" data-act="grade" data-g="${nextG.id}">⬆️ ${nextG.id}급 도전하기</button>` : ''}
    </div>
  </div>`;
}

/* ---------- 입력 ---------- */
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'rename': { const n = prompt('이름을 알려 주세요', S.name); if (n !== null) { S.name = n.trim().slice(0, 8); save(); render(); } return; }
    case 'sound': S.sound = !S.sound; save(); el.textContent = S.sound ? '🔔' : '🔕'; sfx.tap(); return;
    case 'voice': S.voice = !S.voice; save(); el.textContent = S.voice ? '🗣️' : '🤐'; if (S.voice) speak('읽어 줄게요'); return;
    case 'home': go({ name: 'home' }); return;
    case 'stickers': go({ name: 'stickers' }); return;
    case 'grade': sfx.tap(); go({ name: 'grade', g: +el.dataset.g }); return;
    case 'back': go({ name: 'grade', g: view.g }); return;
    case 'study': go({ name: 'study', g: view.g }); return;
    case 'say': document.querySelectorAll('.hcard.on').forEach((b) => b.classList.remove('on')); el.classList.add('on'); speak(el.dataset.t, true); return;
    case 'start': sfx.tap(); startGame(view.g, el.dataset.game); return;
    case 'quit':
      if (play && play.idx > 0 && !confirm('그만하고 나갈까요?')) return;
      go({ name: 'grade', g: view.g }); return;
    case 'speak': if (play && play.q.say) speak(play.q.say, true); return;
    case 'choose': if (play) choose(+el.dataset.i, el); return;
    case 'mcard': if (play) tapCard(+el.dataset.i, el); return;
    case 'next': if (play) nextQ(); return;
    case 'pen': pen = el.dataset.c; document.querySelectorAll('.colors button').forEach((b) => b.classList.toggle('on', b === el)); return;
    case 'erase': eraseTrace(); return;
    case 'check': checkTrace(); return;
  }
});
document.addEventListener('keydown', (e) => {
  if (!play) return;
  if (play.locked && e.key === 'Enter' && $('[data-act="next"]')) { nextQ(); return; }
  if (play.q && play.q.choices && !play.locked) { const i = '1234'.indexOf(e.key); if (i >= 0) { const b = document.querySelectorAll('.choice')[i]; if (b && !b.disabled) b.click(); } }
});
if ('speechSynthesis' in window) speechSynthesis.getVoices();
render();
</script>
