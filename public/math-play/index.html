<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffb703">
<title>재미있는 수학놀이 🧮</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='90'>🧮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2b2d42; --muted: #7a7f99; --card: #ffffff; --line: #e6e8f0;
  --good: #2fb36d; --bad: #ff5a5f;
  --main: #ff9f1c; --main2: #ffbf69; --soft: #fff1d6;
}
.t-little { --main: #ff9f1c; --main2: #ffbf69; --soft: #fff1d6; }
.t-big    { --main: #4f6bed; --main2: #8aa0ff; --soft: #e7ecff; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  background: linear-gradient(160deg, #fff7e6 0%, #e8f4ff 55%, #f3e8ff 100%) fixed;
  color: var(--ink); min-height: 100vh; overflow-x: hidden;
  user-select: none; -webkit-user-select: none;
}
button { font-family: inherit; cursor: pointer; border: 0; color: inherit; }
b { font-weight: normal; color: var(--main); }

.screen { max-width: 760px; margin: 0 auto; padding: 16px 16px 32px; min-height: 100vh; }

/* ---------- 공통 ---------- */
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.topbar .ttl { flex: 1; font-size: 20px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon { width: 46px; height: 46px; border-radius: 14px; background: #fff; font-size: 22px; box-shadow: 0 3px 0 var(--line); flex: none; text-decoration: none; display: grid; place-items: center; }
.icon:active { transform: translateY(2px); box-shadow: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 22px; border-radius: 18px; font-size: 20px; background: var(--main); color: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--main) 70%, #000); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--main) 70%, #000); }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--line); }

/* ---------- 홈 ---------- */
.home-hero { text-align: center; margin: 18px 0 22px; }
.home-hero .logo { font-size: 64px; animation: bob 2.4s ease-in-out infinite; }
.home-hero h1 { font-size: 36px; margin: 6px 0 4px; font-weight: normal; }
.home-hero p { color: var(--muted); margin: 0; font-size: 17px; }
.tracks { display: grid; gap: 16px; }
.track-card { position: relative; text-align: left; background: #fff; border-radius: 28px; padding: 22px 22px 20px; box-shadow: 0 8px 0 var(--main2), 0 14px 30px rgba(0,0,0,.08); border: 3px solid var(--main2); display: flex; gap: 16px; align-items: center; width: 100%; }
.track-card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--main2); }
.track-card .te { font-size: 64px; flex: none; animation: bob 2.8s ease-in-out infinite; }
.track-card .age { display: inline-block; background: var(--main); color: #fff; border-radius: 999px; padding: 3px 12px; font-size: 15px; }
.track-card h2 { font-size: 27px; margin: 6px 0 2px; font-weight: normal; }
.track-card .ts { color: var(--muted); font-size: 15px; }
.track-card .tstat { margin-top: 8px; font-size: 16px; }
.track-card .who { font-size: 16px; color: var(--main); }
.edit-name { position: absolute; top: 12px; right: 12px; background: var(--soft); border-radius: 12px; padding: 6px 10px; font-size: 14px; }
.home-foot { display: flex; justify-content: center; gap: 10px; margin-top: 26px; flex-wrap: wrap; }

/* ---------- 단계 목록 ---------- */
.track-head { background: #fff; border-radius: 24px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 0 var(--main2); margin-bottom: 14px; }
.track-head .te { font-size: 46px; }
.track-head h2 { margin: 0; font-size: 24px; font-weight: normal; }
.track-head p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.quick button { background: var(--soft); border-radius: 18px; padding: 14px 10px; font-size: 18px; box-shadow: 0 4px 0 color-mix(in srgb, var(--main2) 60%, #fff); }
.quick button small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.lv { position: relative; text-align: left; background: #fff; border-radius: 22px; padding: 16px; box-shadow: 0 5px 0 var(--line); display: flex; gap: 12px; align-items: center; min-height: 96px; }
.lv:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.lv .le { font-size: 40px; flex: none; width: 52px; text-align: center; }
.lv .ln { font-size: 13px; color: var(--main); }
.lv .lt { font-size: 19px; line-height: 1.2; }
.lv .ld { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.lv .ls { font-size: 17px; margin-top: 4px; letter-spacing: 1px; color: #ffc107; }
.lv .ls .off { color: #dde1ea; }
.lv.locked { opacity: .55; }
.lv.locked .le { filter: grayscale(1); }
.lv .lock { position: absolute; right: 12px; top: 10px; font-size: 20px; }
.settings { margin-top: 18px; background: #fff; border-radius: 20px; padding: 14px 16px; display: grid; gap: 10px; }
.settings .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 17px; }
.seg { display: inline-flex; background: #f1f3f8; border-radius: 14px; padding: 4px; }
.seg button { background: transparent; padding: 8px 14px; border-radius: 10px; font-size: 16px; color: var(--muted); }
.seg button.on { background: var(--main); color: #fff; }

/* ---------- 플레이 ---------- */
.play { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 16px; }
.path { display: flex; align-items: center; gap: 4px; background: #fff; border-radius: 999px; padding: 6px 10px; margin-bottom: 12px; }
.path .step { flex: 1; height: 30px; border-radius: 999px; background: #f1f3f8; display: grid; place-items: center; font-size: 15px; position: relative; }
.path .step.done { background: var(--soft); }
.path .step.cur { background: var(--main2); }
.path .runner { position: absolute; font-size: 26px; top: -8px; animation: hop .6s ease-in-out infinite alternate; }
.path .goal { font-size: 26px; flex: none; }
.timebox { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.timebar { flex: 1; height: 22px; border-radius: 999px; background: #fff; overflow: hidden; }
.timebar div { height: 100%; width: 100%; background: linear-gradient(90deg, #ff6b6b, var(--main)); transition: width .1s linear; border-radius: 999px; }
.timebox .tn { font-size: 22px; min-width: 120px; text-align: right; }

.qcard { background: #fff; border-radius: 28px; padding: 18px 16px 14px; box-shadow: 0 8px 0 var(--main2); text-align: center; position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-height: 260px; }
.qtext { font-size: 22px; line-height: 1.45; }
.qtext:empty, .visual:empty { display: none; }
.visual { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.vt { margin: 0; font-size: 18px; color: var(--muted); }
.eq { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; font-size: clamp(38px, 10vw, 62px); line-height: 1.1; }
.eq.small { font-size: clamp(30px, 8vw, 50px); gap: 4px 6px; }
.eq .op { color: var(--main); }
.eq .comma { color: var(--muted); margin-left: -8px; }
.eq .unit { font-size: .55em; color: var(--muted); }
.blank { position: relative; min-width: 1.5em; height: 1.25em; padding: 0 .15em; border-radius: 16px; border: 4px dashed var(--main2); background: var(--soft); display: inline-flex; align-items: center; justify-content: center; }
.blank b { color: var(--ink); }
.blank:empty::after, .blank b:empty::after { content: '?'; color: var(--main2); }
.blank.active { border-style: solid; border-color: var(--main); animation: glow 1s ease-in-out infinite alternate; }
.blank small { position: absolute; top: -1.35em; left: 50%; transform: translateX(-50%); font-size: 15px; color: var(--muted); white-space: nowrap; }
.blank.good { border: 4px solid var(--good); background: #e3f9ec; }
.blank.good b { color: var(--good); }
.blank.reveal { border: 4px solid var(--bad); background: #ffeceb; }
.blank.reveal b { color: var(--bad); }
.eq.has-label { margin-top: 18px; }

.hintbtn { position: absolute; right: 12px; top: 12px; background: #fff8d6; border-radius: 14px; padding: 6px 12px; font-size: 16px; box-shadow: 0 3px 0 #f2e2a0; }
.hintbox { background: #fffbea; border: 2px dashed #ffd666; border-radius: 18px; padding: 10px 12px; font-size: 18px; line-height: 1.5; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hintbox p { margin: 0; }
.hintbox[hidden] { display: none; }
.explain { font-size: 20px; line-height: 1.6; }
.explain small { color: var(--muted); font-size: 16px; }
.feedback { min-height: 30px; font-size: 22px; }
.feedback.good { color: var(--good); animation: pop .35s ease; }
.feedback.bad { color: var(--bad); }
.sec { display: inline-block; background: #e7f5ff; color: #1c7ed6; border-radius: 999px; padding: 0 10px; margin-left: 4px; }
.sec.fast { background: #fff3bf; color: #e67700; }
.combo { display: inline-block; background: #fff0e0; color: #ff6b00; border-radius: 999px; padding: 0 10px; margin-left: 4px; }

.answer { margin-top: 14px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { font-size: clamp(30px, 8vw, 44px); padding: 16px 8px; border-radius: 22px; color: #fff; }
.choice.c0 { background: #ff6b6b; box-shadow: 0 6px 0 #d94848; }
.choice.c1 { background: #4dabf7; box-shadow: 0 6px 0 #2f87d1; }
.choice.c2 { background: #51cf66; box-shadow: 0 6px 0 #34a84a; }
.choice.c3 { background: #b197fc; box-shadow: 0 6px 0 #8c6fe0; }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.choice.wrongc, .choice:disabled { opacity: .3; transform: scale(.94); }
.choice.rightc { outline: 5px solid var(--good); outline-offset: 3px; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button { font-size: 32px; padding: 12px 0; border-radius: 18px; background: #fff; box-shadow: 0 5px 0 var(--line); }
.pad button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.pad .ok { background: var(--good); color: #fff; box-shadow: 0 5px 0 #1f8a51; }
.pad .del { background: #f1f3f8; }
.nextbtn { width: 100%; font-size: 26px; padding: 18px; }

/* ---------- 시각 자료 ---------- */
.items { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 2px; font-size: 30px; max-width: 240px; line-height: 1.15; }
.items.sm { font-size: 24px; max-width: 220px; }
.items.xs { font-size: 20px; max-width: 260px; }
.items i { font-style: normal; animation: pop .3s ease backwards; }
.pics { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.pics > .items { background: #f6f8fc; border: 2px solid #e3e8f2; border-radius: 18px; padding: 6px 10px; max-width: 42%; font-size: 26px; }
.pics:has(.pplus) { flex-wrap: nowrap; }
.pics > .items:only-child { max-width: 100%; }
.pplus { font-size: 36px; color: var(--main); }
.tf-wrap { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.tf { display: grid; grid-template-columns: repeat(5, 26px); gap: 4px; padding: 6px; background: #fff; border: 3px solid #cfd6e6; border-radius: 10px; }
.tf span { width: 26px; height: 26px; border-radius: 50%; background: #f1f3f8; }
.tf .dot.a { background: #ff6b6b; }
.tf .dot.b { background: #4dabf7; }
.tf .dot.c { background: #51cf66; }
.tf .dot.ghost { background: #fff; border: 3px dashed #ffb703; }
.groups { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.plate { background: radial-gradient(ellipse at center, #fff 40%, #eef1f7 100%); border: 3px solid #dde3ef; border-radius: 50%; min-width: 92px; min-height: 80px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.plate .items { font-size: 22px; max-width: 80px; }
.plate .kid { font-size: 28px; }
.friends { font-size: 38px; letter-spacing: 4px; }
.arr { display: grid; gap: 4px; }
.arr i { width: 16px; height: 16px; border-radius: 50%; background: #4dabf7; }
.arr i.r1 { background: #ff8787; }

/* ---------- 결과 / 스티커 / 구구단판 ---------- */
.result { text-align: center; padding-top: 40px; }
.result .re { font-size: 90px; animation: bob 2s ease-in-out infinite; }
.result h2 { font-size: 32px; margin: 8px 0; font-weight: normal; }
.result .stars { font-size: 64px; letter-spacing: 6px; color: #ffc107; }
.result .stars span { display: inline-block; animation: starIn .5s ease backwards; }
.result .stars .off { color: #dde1ea; }
.result p { font-size: 20px; margin: 8px 0; }
.result .bigscore { font-size: 72px; color: var(--main); }
.newsticker { margin: 18px auto; background: #fff; border-radius: 24px; padding: 14px 20px; display: inline-block; box-shadow: 0 6px 0 var(--main2); font-size: 20px; }
.newsticker span { font-size: 56px; display: inline-block; animation: spinIn .8s ease backwards; margin: 0 4px; }
.result .acts { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 22px auto 0; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.sgrid div { background: #fff; border-radius: 18px; aspect-ratio: 1; display: grid; place-items: center; font-size: 42px; box-shadow: 0 4px 0 var(--line); }
.sgrid div.no { font-size: 26px; color: #c9cede; background: #f6f7fb; }
.board { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 16px; }
.board th { color: var(--muted); font-weight: normal; }
.board td { background: #f1f3f8; border-radius: 10px; text-align: center; padding: 8px 0; cursor: pointer; }
.board td.g1 { background: #d3f9d8; }
.board td.g2 { background: #51cf66; color: #fff; }
.board td.y { background: #fff3bf; }
.board td.r { background: #ffc9c9; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 14px; color: var(--muted); margin: 10px 0; }
.legend span::before { content: ''; display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 4px; vertical-align: -2px; background: var(--c); }
.factmsg { text-align: center; font-size: 24px; min-height: 44px; margin: 6px 0; }
.panel { background: #fff; border-radius: 24px; padding: 16px; box-shadow: 0 6px 0 var(--line); }

/* ---------- 효과 ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.cf { position: absolute; top: -50px; animation: fall linear forwards; }
.shake { animation: shake .4s ease; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-6px); } }
@keyframes glow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--main) 40%, transparent); } to { box-shadow: 0 0 0 8px color-mix(in srgb, var(--main) 10%, transparent); } }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes spinIn { from { transform: scale(0) rotate(-360deg); } to { transform: scale(1) rotate(0); } }

@media (max-width: 480px) {
  .track-card .te { font-size: 50px; }
  .track-card h2 { font-size: 23px; }
  .levels { grid-template-columns: 1fr 1fr; }
  .lv { flex-direction: column; text-align: center; padding: 12px 8px; gap: 4px; }
  .lv .lt { font-size: 17px; }
  .qtext { font-size: 19px; }
  .tf { grid-template-columns: repeat(5, 20px); }
  .tf span { width: 20px; height: 20px; }
  .pad button { font-size: 28px; padding: 10px 0; }
}
@media (min-height: 800px) and (min-width: 600px) {
  .choice { padding: 24px 8px; }
  .pad button { padding: 16px 0; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>

<script>
'use strict';
/* =========================================================
   재미있는 수학놀이
   - 7살: 덧셈 탐험대 (합 20까지 + 곱셈 맛보기)
   - 10살: 곱셈·나눗셈 챌린지 (구구단 · 나눗셈 · 나머지)
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// 받침 있는 숫자인지 (조사 고르기용): 0(십·백·영) 1(일) 3(삼) 6(육) 7(칠) 8(팔)
const jb = (n) => [0, 1, 3, 6, 7, 8].includes(Math.abs(n) % 10);
const eun = (n) => n + (jb(n) ? '은' : '는');
const eul = (n) => n + (jb(n) ? '을' : '를');
const gwa = (n) => n + (jb(n) ? '과' : '와');

const FOODS = ['🍎', '🍓', '🍊', '🍌', '🍇', '🍒', '🍑', '🥕', '🍪', '🧁', '🍩', '⭐', '🐟', '🎈', '🌸', '🍬'];
const KIDS = ['🧒', '👧', '👦', '🐻', '🐰'];
const PRAISE = ['딩동댕! 🎉', '최고야! 👍', '우와, 천재다! 🌟', '정답! 잘했어 😄', '짝짝짝! 👏', '대단해! 💯', '멋져요! ✨'];
const RETRY = ['아깝다! 다시 생각해 볼까? 💪', '괜찮아, 한 번 더! 🙂', '거의 다 왔어! 천천히 생각해 봐요 🤔'];

/* ---------- 그림 도우미 ---------- */
function items(n, e) {
  const cls = n > 15 ? 'xs' : n > 9 ? 'sm' : '';
  return `<span class="items ${cls}">${Array.from({ length: n }, (_, i) => `<i style="animation-delay:${i * 0.03}s">${e}</i>`).join('')}</span>`;
}
function tenFrame(parts) {
  const seq = [];
  parts.forEach((p) => { for (let i = 0; i < p.n; i++) seq.push(p.c); });
  const frames = Math.max(1, Math.ceil(seq.length / 10));
  let h = '<div class="tf-wrap">';
  for (let f = 0; f < frames; f++) {
    h += '<div class="tf">';
    for (let i = 0; i < 10; i++) { const c = seq[f * 10 + i]; h += `<span class="${c ? 'dot ' + c : ''}"></span>`; }
    h += '</div>';
  }
  return h + '</div>';
}
function groups(g, n, e) {
  return `<div class="groups">${Array.from({ length: g }, () => `<div class="plate">${items(n, e)}</div>`).join('')}</div>`;
}
function arrayDots(rows, cols) {
  let h = `<div class="arr" style="grid-template-columns:repeat(${cols},16px)">`;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) h += `<i class="r${r % 2}"></i>`;
  return h + '</div>';
}
const dan = (d, upto) => Array.from({ length: upto }, (_, i) => d * (i + 1)).join(', ');

/* ---------- 문제 만들기: 7살 ---------- */
function tenHint(a, b) {
  const s = a + b;
  let t;
  if (a < 10 && s > 10) { const need = 10 - a; t = `<p>${a}에 <b>${eul(need)}</b> 먼저 더하면 딱 10!<br>남은 <b>${b - need}</b>${jb(b - need) ? '을' : '를'} 더 더하면? 10 + ${b - need} = ?</p>`; }
  else if (a >= 10) t = `<p>${eun(a)} 10과 ${a - 10}<br>${a - 10} + ${b} 먼저 해 봐요!</p>`;
  else t = '<p>점을 하나씩 세어 봐요! 👆</p>';
  return tenFrame([{ n: a, c: 'a' }, { n: b, c: 'b' }]) + t;
}

const LITTLE = [

function award(tid) {

/* ---------- 소리 ---------- */
let actx = null;
function tone(freq, dur, type = 'sine', when = 0, vol = 0.15) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) { /* 소리 없이 진행 */ }
}
const sfx = {
  ok() { tone(660, 0.12, 'triangle'); tone(880, 0.2, 'triangle', 0.1); },
  bad() { tone(240, 0.22, 'sawtooth', 0, 0.07); tone(180, 0.25, 'sawtooth', 0.12, 0.07); },
  tap() { tone(520, 0.05, 'sine', 0, 0.06); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', i * 0.13)); },
};
function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.9; speechSynthesis.speak(u);
  } catch (e) { /* 무시 */ }
}
const SAY_OP = { '+': '더하기', '×': '곱하기', '÷': '나누기', '=': '는', '…': '나머지', ',': ',' };
function sayQ(q) {
  const eqs = q.eq.map((p) => (/^\{B/.test(p) ? '네모' : SAY_OP[p] || String(p).replace(/^u:/, ''))).join(' ');
  speak((q.say ? q.say + ' ' : '') + (q.sayEq === false ? '' : eqs));
}

function confetti(n = 40) {
  const fx = $('#fx'), em = ['🎉', '⭐', '🎈', '✨', '💛', '🌟', '🍬', '💜'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'cf'; s.textContent = pick(em);
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
    s.style.animationDelay = Math.random() * 0.4 + 's';
    s.style.fontSize = 18 + Math.random() * 22 + 'px';
    fx.appendChild(s); setTimeout(() => s.remove(), 3800);
  }
}

function startLevel(tid, lid) {

  const level = time ? null : lid === 'weak' ? WEAK : T.levels.find((l) => l.id === lid);
  play = { tid, lid, level, time, idx: 0, total: time ? Infinity : 10, results: [], mistakes: 0, combo: 0, maxCombo: 0, score: 0, firstOk: 0, recent: [], solved: 0, times: [] };

function timeLevels(tid) {
  const L = TRACKS[tid].levels, out = [];
  L.forEach((l, i) => { if (unlocked(tid, i)) out.push(l); });
  return out;
}
// 최근에 푼 문제는 피하고, 안 풀어 본 문제(없으면 가장 오래전에 푼 문제)를 고른다. 기록은 이 기기에 저장된다.
function pickFresh(make, bucketId, recent, keep) {
  S.seen = S.seen || {}; S.seenN = S.seenN || 0;
  const b = S.seen[bucketId] = S.seen[bucketId] || {};
  let best = null, bestScore = Infinity;
  for (let k = 0; k < 40; k++) {
    const q = make();
    if (recent.includes(q.key)) { if (!best) best = q; continue; }
    const sc = b[q.key] === undefined ? -1 : b[q.key];
    if (sc < bestScore) { best = q; bestScore = sc; if (sc === -1) break; }
  }
  recent.push(best.key); if (recent.length > keep) recent.shift();
  b[best.key] = ++S.seenN;
  const keys = Object.keys(b);
  if (keys.length > 400) keys.sort((x, y) => b[x] - b[y]).slice(0, 100).forEach((x) => delete b[x]);
  save();
  return best;
}
function genQ() {
  const p = play;
  return pickFresh(() => (p.time ? pick(timeLevels(p.tid)) : p.level).gen(), `${p.tid}:${p.time ? 'time' : p.level.id}`, p.recent, 6);
}
const label = (v) => (v.length === 2 ? `${v[0]} … ${v[1]}` : `${v[0]}`);
function makeChoices(q) {
  const ans = q.ans, seen = new Set([label(ans)]), out = [ans];
  let cands;
  if (ans.length === 2) {
    const [a, b] = ans, d = q.d || 99;
    cands = shuffle([[a + 1, b], [a - 1, b], [a, b + 1], [a, b - 1], [a + 1, b - 1], [a - 1, b + 1], [a + 2, b]]).filter(([x, y]) => x >= 0 && y >= 0 && y < d);
  } else {
    const x = ans[0];
    cands = [...shuffle((q.near || []).slice()), ...shuffle([x + 1, x - 1, x + 2, x - 2]), ...shuffle([x + 10, x - 10, x + 3, x - 3])]
      .filter((v) => v >= 0).map((v) => [v]);
  }
  for (const c of cands) { if (out.length >= 4) break; const k = label(c); if (!seen.has(k)) { seen.add(k); out.push(c); } }
  let extra = 4;
  while (out.length < 4) { const c = ans.length === 2 ? [ans[0] + extra, ans[1]] : [ans[0] + extra]; if (!seen.has(label(c))) { seen.add(label(c)); out.push(c); } extra++; }
  return shuffle(out);
}

function renderEq(q) {
  return q.eq.map((part) => {
    const m = /^\{B(\d)\}$/.exec(part);
    if (m) return `<span class="blank" data-slot="${m[1]}" data-act="slot">${q.labels ? `<small>${q.labels[m[1]]}</small>` : ''}<b></b></span>`;
    if (part === ',') return '<span class="comma">,</span>';
    if (SAY_OP[part]) return `<span class="op">${part}</span>`;
    if (typeof part === 'string' && part.startsWith('u:')) return `<span class="unit">${part.slice(2)}</span>`;
    return `<span class="num">${part}</span>`;
  }).join('');
}

function updateBlanks() {

}

}
function fb(html, cls) { const el = $('#fb'); if (el) { el.className = 'feedback ' + cls; el.innerHTML = html; } }
function showHint() { const q = play.q, h = $('#hint'); if (h && q.hint) { h.innerHTML = q.hint; h.hidden = false; } }
function later(fn, ms) { const p = play; setTimeout(() => { if (play === p) fn(); }, ms); }
function showNext(explain) {

  $('#answer').innerHTML = '<button class="btn nextbtn" data-act="next">다음 ▶</button>';
}

function onKey(k) {
  const p = play;
  if (!p || p.locked || p.choices) return;
  const n = p.q.ans.length;
  sfx.tap();
  if (k === 'del') {
    if (p.input[p.slot] === '' && p.slot > 0) p.slot--;
    p.input[p.slot] = p.input[p.slot].slice(0, -1);
  } else if (k === 'ok') {
    if (p.input[p.slot] === '') { shake($('#eq')); return; }
    if (p.slot < n - 1) { p.slot++; updateBlanks(); return; }
    if (p.input.slice(0, n).some((v) => v === '')) { p.slot = p.input.findIndex((v) => v === ''); updateBlanks(); return; }
    return submit(p.input.slice(0, n).map(Number));
  } else if (p.input[p.slot].length < 3) {
    p.input[p.slot] = (p.input[p.slot] + k).replace(/^0+(?=\d)/, '');
  }
  updateBlanks();
}
function submit(arr, btn) {
  const p = play, q = p.q;
  if (!p || p.locked) return;
  const ok = arr.length === q.ans.length && arr.every((v, i) => v === q.ans[i]);
  if (p.tid === 'big' && q.fact && p.tries === 0) { recordFact(q.fact, ok); save(); }
  if (ok) onCorrect(btn); else onWrong(arr, btn);
}
function onCorrect(btn) {
  const p = play, q = p.q;
  p.locked = true; sfx.ok();
  if (btn) btn.classList.add('rightc');
  const first = p.tries === 0;
  p.results[p.idx] = first;
  if (first) { p.firstOk++; p.combo++; p.maxCombo = Math.max(p.maxCombo, p.combo); }
  fillAnswer('good');
  const sec = (Date.now() - p.qStart) / 1000;
  p.times.push(sec);
  let msg = pick(PRAISE) + ` <span class="sec ${sec < 3 ? 'fast' : ''}">${sec < 3 ? '⚡' : '⏱️'} ${sec.toFixed(1)}초</span>`;
  if (first && p.combo >= 3) msg += ` <span class="combo">🔥 ${p.combo}연속!</span>`;
  confetti(first && p.combo >= 3 ? 14 : 6);
  if (p.time) { p.score += 1 + (p.combo >= 5 ? 1 : 0); const s = $('#score'); if (s) s.textContent = p.score; fb(msg, 'good'); later(nextQ, 450); return; }
  fb(msg, 'good');
  if (q.teach && q.explain) { showNext(true); return; }
  later(nextQ, 1000);
}
function onWrong(arr, btn) {
  const p = play, q = p.q;
  sfx.bad(); p.combo = 0; shake($('#qcard'));
  if (btn) { btn.classList.add('wrongc'); btn.disabled = true; }
  if (p.time) { p.locked = true; fillAnswer('reveal'); fb(`정답은 <b>${label(q.ans)}</b>`, 'bad'); later(nextQ, 900); return; }
  p.tries++;
  if (p.tries === 1) {
    p.mistakes++;
    let m = pick(RETRY);
    if (q.ans.length === 2 && arr[0] === q.ans[0]) m = (q.labels[0] === '몫' ? '몫은 맞았어요! 👍' : '앞의 답은 맞았어요! 👍') + ' 나머지를 다시 봐요';
    if (q.d && arr.length === 2 && arr[1] >= q.d) m = `나머지는 ${q.d}보다 작아야 해요! 🤔`;
    fb(m, 'bad');
    p.input = ['', '']; p.slot = 0; updateBlanks();
    return;
  }
  p.locked = true; p.results[p.idx] = false;
  fillAnswer('reveal');
  fb(`정답은 <b>${label(q.ans)}</b> 이에요. 다음엔 꼭 맞힐 수 있어! 💪`, 'bad');
  showNext(true);
}
function nextQ() {

}
function finish() {
  const p = play, T = S.tracks[p.tid];
  if (p.timer) clearInterval(p.timer);
  const r = { tid: p.tid, lid: p.lid, time: p.time, score: p.score, firstOk: p.firstOk, total: p.total, maxCombo: p.maxCombo, avg: p.times.length ? p.times.reduce((a, b) => a + b, 0) / p.times.length : 0, fastest: p.times.length ? Math.min(...p.times) : 0, stickers: [], stars: 0, newBest: false };
  if (p.time) {
    if (p.score > T.best) { r.newBest = true; T.best = p.score; if (p.score >= 8) r.stickers.push(award(p.tid)); }
  } else {
    r.stars = p.mistakes <= 1 ? 3 : p.mistakes <= 3 ? 2 : 1;
    const prev = T.stars[p.lid] || 0;
    if (p.lid !== 'weak') T.stars[p.lid] = Math.max(prev, r.stars);
    r.stickers.push(award(p.tid));
    if (r.stars === 3 && prev < 3 && p.lid !== 'weak') r.stickers.push(award(p.tid));
    const L = TRACKS[p.tid].levels, i = L.findIndex((l) => l.id === p.lid);
    r.next = i >= 0 && i < L.length - 1 ? L[i + 1].id : null;
    r.unlockedNew = r.next && prev === 0;
  }
  r.stickers = r.stickers.filter(Boolean);
  save(); sfx.win(); confetti(50);
  play = null;
  view = { name: 'result', t: r.tid, r };
  render();
}
function renderResult() {
  const r = view.r, T = TRACKS[r.tid];
  document.body.className = 't-' + r.tid;
  const lvTitle = r.time ? '60초 도전' : r.lid === 'weak' ? WEAK.title : T.levels.find((l) => l.id === r.lid).title;
  const msgs = { 3: '완벽해요! 수학 왕이에요 👑', 2: '아주 잘했어요! 조금만 더 하면 별 3개! 💪', 1: '끝까지 해냈어요! 다시 하면 더 잘할 거예요 😊' };
  app.innerHTML = `<div class="screen result">
    <div class="re">${r.time ? '⏱️' : r.stars === 3 ? '🏆' : '🎉'}</div>
    <h2>${lvTitle} ${r.time ? '끝!' : '완료!'}</h2>
    ${r.time
      ? `<div class="bigscore">${r.score}점</div><p>${r.newBest ? '🎊 새로운 최고 기록이에요!' : `최고 기록: ${S.tracks[r.tid].best}점`}</p><p>최고 연속 정답 🔥 ${r.maxCombo}</p>`
      : `<div class="stars">${[1, 2, 3].map((k) => `<span class="${k <= r.stars ? '' : 'off'}" style="animation-delay:${k * 0.25}s">★</span>`).join('')}</div>
         <p>${msgs[r.stars]}</p><p>한 번에 맞힌 문제 ${r.firstOk} / ${r.total} · 최고 연속 🔥 ${r.maxCombo}</p>
         ${r.unlockedNew ? '<p>🔓 다음 단계가 열렸어요!</p>' : ''}`}
    ${r.avg ? `<p>⏱️ 평균 ${r.avg.toFixed(1)}초 · ⚡ 가장 빨리 ${r.fastest.toFixed(1)}초</p>` : ''}
    ${r.stickers.length ? `<div class="newsticker">새 스티커를 받았어요!<br>${r.stickers.map((s) => `<span>${s}</span>`).join('')}</div>` : ''}
    <div class="acts">
      ${r.next ? `<button class="btn" data-act="start" data-l="${r.next}">다음 단계로 ▶</button>` : ''}
      <button class="btn ${r.next ? 'ghost' : ''}" data-act="start" data-l="${r.lid}">🔁 다시 하기</button>
      <button class="btn ghost" data-act="levels">📋 단계 고르기</button>
    </div>
  </div>`;
}

/* ---------- 입력 처리 ---------- */
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, t = el.dataset.t;
  switch (act) {
    case 'rename': {
      e.stopPropagation();
      const n = prompt(`${TRACKS[t].age} 친구의 이름을 알려 주세요`, S.tracks[t].name);
      if (n !== null) { S.tracks[t].name = n.trim().slice(0, 8); save(); render(); }
      return;
    }
    case 'track': sfx.tap(); go({ name: 'levels', t }); return;
    case 'home': go({ name: 'home' }); return;
    case 'levels': case 'back': go({ name: 'levels', t: view.t }); return;
    case 'sound': S.sound = !S.sound; save(); el.textContent = S.sound ? '🔔' : '🔕'; sfx.tap(); return;
    case 'stickers': go({ name: 'stickers', t: view.t }); return;
    case 'board': go({ name: 'board', t: 'big' }); return;
    case 'input': S.tracks[view.t].input = el.dataset.v; save(); render(); return;
    case 'open': S.tracks[view.t].open = el.dataset.v === '1'; save(); render(); return;
    case 'start':
      if (el.dataset.locked) { shake(el); sfx.bad(); return; }
      sfx.tap(); startLevel(view.t, el.dataset.l); return;
    case 'fact': {
      const a = +el.dataset.a, b = +el.dataset.b, v = S.tracks.big.facts[`${a}x${b}`];
      $('#factmsg').innerHTML = `${a} × ${b} = <b>${a * b}</b> <small style="font-size:15px;color:var(--muted)">${v ? `(맞힘 ${v.ok} · 틀림 ${v.bad})` : ''}</small>`;
      speak(`${a} 곱하기 ${b}는 ${a * b}`);
      return;
    }
    case 'quit':
      if (play && (play.time || play.idx > 0) && !confirm('그만하고 나갈까요?')) return;
      go({ name: 'levels', t: view.t }); return;
    case 'speak': if (play) sayQ(play.q); return;
    case 'hint': showHint(); el.remove(); return;
    case 'choose': if (play && !play.locked) submit(play.choices[+el.dataset.i], el); return;
    case 'key': onKey(el.dataset.k); return;
    case 'slot': if (play && !play.locked && !play.choices) { play.slot = +el.dataset.slot; updateBlanks(); } return;
    case 'next': if (play) nextQ(); return;
  }
});
document.addEventListener('keydown', (e) => {
  if (!play) return;
  if (play.locked) { if ((e.key === 'Enter' || e.key === ' ') && $('[data-act="next"]')) { e.preventDefault(); nextQ(); } return; }
  if (play.choices) { const i = '1234'.indexOf(e.key); if (i >= 0) { const b = document.querySelectorAll('.choice')[i]; if (b && !b.disabled) b.click(); } return; }
  if (/^\d$/.test(e.key)) onKey(e.key);
  else if (e.key === 'Backspace') { e.preventDefault(); onKey('del'); }
  else if (e.key === 'Enter') onKey('ok');
  else if (e.key === 'Tab' && play.q.ans.length === 2) { e.preventDefault(); play.slot = 1 - play.slot; updateBlanks(); }
});

render();
</script>
</body>
</html>
