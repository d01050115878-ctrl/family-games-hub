<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff6b9a">
<title>재미있는 한글놀이 🌈</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='90'>✏️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2b2d42; --muted: #7a7f99; --line: #e6e8f0;
  --good: #2fb36d; --bad: #ff5a5f;
  --main: #ff6b9a; --main2: #ffa8c5; --soft: #ffe3ee;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  background: linear-gradient(160deg, #fff0f6 0%, #fff9db 50%, #e6fcf5 100%) fixed;
  color: var(--ink); min-height: 100vh; overflow-x: hidden;
  user-select: none; -webkit-user-select: none;
}
button { font-family: inherit; cursor: pointer; border: 0; color: inherit; }
b { font-weight: normal; color: var(--main); }
.screen { max-width: 760px; margin: 0 auto; padding: 16px 16px 32px; min-height: 100vh; }

.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.topbar .ttl { flex: 1; font-size: 20px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon { width: 46px; height: 46px; border-radius: 14px; background: #fff; font-size: 22px; box-shadow: 0 3px 0 var(--line); flex: none; text-decoration: none; display: grid; place-items: center; }
.icon:active { transform: translateY(2px); box-shadow: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 22px; border-radius: 18px; font-size: 20px; background: var(--main); color: #fff; box-shadow: 0 5px 0 #d94c7c; text-decoration: none; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d94c7c; }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--line); }
.btn.green { background: var(--good); box-shadow: 0 5px 0 #1f8a51; }

/* 홈 */
.hero { text-align: center; margin: 10px 0 18px; }
.hero .logo { font-size: 60px; animation: bob 2.4s ease-in-out infinite; }
.hero h1 { font-size: 34px; margin: 4px 0; font-weight: normal; }
.hero p { margin: 0; color: var(--muted); font-size: 17px; }
.who { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 16px; box-shadow: 0 3px 0 var(--line); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.game { --c: #ff6b9a; text-align: left; background: #fff; border-radius: 24px; padding: 18px; box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 45%, #fff); border: 3px solid color-mix(in srgb, var(--c) 35%, #fff); display: flex; gap: 12px; align-items: center; }
.game:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 45%, #fff); }
.game .ge { font-size: 46px; flex: none; }
.game h2 { margin: 0; font-size: 22px; font-weight: normal; }
.game p { margin: 3px 0 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
.game .gs { margin-top: 5px; font-size: 14px; color: #ffb703; }
.foot { display: flex; justify-content: center; margin-top: 24px; }

/* 단계 고르기 */
.ghead { background: #fff; border-radius: 24px; padding: 18px; text-align: center; box-shadow: 0 6px 0 var(--main2); margin-bottom: 14px; }
.ghead .ge { font-size: 56px; }
.ghead h2 { margin: 4px 0; font-size: 26px; font-weight: normal; }
.ghead p { margin: 0; color: var(--muted); }
.lvls { display: grid; gap: 12px; }
.lvl { display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; border-radius: 22px; padding: 16px 18px; box-shadow: 0 5px 0 var(--line); }
.lvl:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.lvl .badge { flex: none; width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; background: var(--soft); }
.lvl .ln { font-size: 22px; }
.lvl .ld { font-size: 14px; color: var(--muted); margin-top: 2px; }
.lvl .ls { margin-left: auto; font-size: 22px; color: #ffc107; white-space: nowrap; }
.off { color: #dde1ea !important; }

/* 플레이 */
.play { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 16px; }
.path { display: flex; align-items: center; gap: 4px; background: #fff; border-radius: 999px; padding: 6px 10px; margin-bottom: 12px; }
.path .step { flex: 1; height: 28px; border-radius: 999px; background: #f1f3f8; display: grid; place-items: center; font-size: 14px; position: relative; }
.path .step.done { background: var(--soft); }
.path .step.cur { background: var(--main2); }
.path .runner { position: absolute; font-size: 24px; top: -8px; animation: hop .6s ease-in-out infinite alternate; }
.path .goal { font-size: 24px; flex: none; }
.qcard { background: #fff; border-radius: 28px; padding: 18px 14px 14px; box-shadow: 0 8px 0 var(--main2); text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; min-height: 250px; }
.qtext { font-size: 22px; line-height: 1.45; color: var(--muted); }
.pic { font-size: 96px; line-height: 1.05; animation: pop .35s ease; }
.big { font-size: clamp(36px, 10vw, 58px); line-height: 1.2; letter-spacing: 2px; }
.sent { font-size: clamp(24px, 6.4vw, 34px); line-height: 1.5; word-break: keep-all; }
.hole { display: inline-block; min-width: 1.6em; padding: 0 .2em; border-bottom: 4px solid var(--main); background: var(--soft); border-radius: 10px 10px 0 0; color: var(--main); }
.hole.good { color: var(--good); border-color: var(--good); background: #e3f9ec; }
.hole.reveal { color: var(--bad); border-color: var(--bad); background: #ffeceb; }
.jm { display: inline-grid; place-items: center; min-width: 1.3em; height: 1.3em; border-radius: 16px; color: #fff; padding: 0 .1em; }
.jm.c { background: #4dabf7; } .jm.v { background: #ff8787; } .jm.t { background: #51cf66; }
.plus { color: var(--muted); margin: 0 .15em; }
.listen { width: 130px; height: 130px; border-radius: 50%; background: var(--main); color: #fff; font-size: 60px; box-shadow: 0 8px 0 #d94c7c; animation: pulse 1.6s ease-in-out infinite; }
.listen:active { transform: translateY(4px); box-shadow: 0 4px 0 #d94c7c; }
.feedback { min-height: 30px; font-size: 22px; }
.feedback.good { color: var(--good); animation: pop .35s ease; }
.feedback.bad { color: var(--bad); }
.sec { display: inline-block; background: #e7f5ff; color: #1c7ed6; border-radius: 999px; padding: 0 10px; margin-left: 4px; }
.sec.fast { background: #fff3bf; color: #e67700; }
.combo { display: inline-block; background: #fff0e0; color: #ff6b00; border-radius: 999px; padding: 0 10px; margin-left: 4px; }

.answer { margin-top: 14px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { font-size: clamp(22px, 6.5vw, 36px); padding: 18px 6px; border-radius: 22px; color: #fff; word-break: keep-all; line-height: 1.2; }
.choice.c0 { background: #ff6b6b; box-shadow: 0 6px 0 #d94848; }
.choice.c1 { background: #4dabf7; box-shadow: 0 6px 0 #2f87d1; }
.choice.c2 { background: #51cf66; box-shadow: 0 6px 0 #34a84a; }
.choice.c3 { background: #b197fc; box-shadow: 0 6px 0 #8c6fe0; }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.choice:disabled { opacity: .3; transform: scale(.94); }
.choice.rightc { outline: 5px solid var(--good); outline-offset: 3px; }
.choice small { display: block; font-size: .8em; line-height: 1.1; }
.nextbtn { width: 100%; font-size: 26px; padding: 18px; }

/* 따라쓰기 */
.tinfo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; }
.tinfo .pe { font-size: 44px; }
.tinfo .tn { color: var(--muted); font-size: 18px; }
.board { position: relative; width: 100%; }
.board canvas { display: block; width: 100%; height: auto; border-radius: 20px; }
.board canvas.ink { position: absolute; inset: 0; touch-action: none; cursor: crosshair; }
.tbtns { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
.tbtns .btn { font-size: 22px; padding: 16px; }
.colors { display: flex; justify-content: center; gap: 10px; }
.colors button { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.colors button.on { outline: 4px solid var(--ink); outline-offset: 2px; }

/* 문장 만들기 */
.built { min-height: 74px; width: 100%; border: 3px dashed var(--main2); border-radius: 20px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; background: #fffafc; }
.built:empty::before { content: '낱말을 순서대로 눌러요 👇'; color: #c9cede; font-size: 18px; }
.built.good { border-color: var(--good); background: #e3f9ec; }
.pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 64px; }
.wcard { font-size: clamp(22px, 6vw, 30px); padding: 10px 16px; border-radius: 16px; background: #fff; box-shadow: 0 5px 0 #ffd0e0; border: 2px solid #ffd0e0; }
.wcard:active { transform: translateY(3px); box-shadow: 0 2px 0 #ffd0e0; }
.built .wcard { background: var(--main); color: #fff; border-color: var(--main); box-shadow: 0 4px 0 #d94c7c; }

/* 결과 / 스티커 */
.result { text-align: center; padding-top: 40px; }
.result .re { font-size: 90px; animation: bob 2s ease-in-out infinite; }
.result h2 { font-size: 30px; margin: 8px 0; font-weight: normal; }
.result .stars { font-size: 64px; letter-spacing: 6px; color: #ffc107; }
.result .stars span { display: inline-block; animation: starIn .5s ease backwards; }
.result p { font-size: 20px; margin: 8px 0; }
.newsticker { margin: 16px auto; background: #fff; border-radius: 24px; padding: 14px 20px; display: inline-block; box-shadow: 0 6px 0 var(--main2); font-size: 20px; }
.newsticker span { font-size: 56px; display: inline-block; animation: spinIn .8s ease backwards; margin: 0 4px; }
.acts { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 22px auto 0; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.sgrid div { background: #fff; border-radius: 18px; aspect-ratio: 1; display: grid; place-items: center; font-size: 42px; box-shadow: 0 4px 0 var(--line); }
.sgrid div.no { font-size: 26px; color: #c9cede; background: #f6f7fb; }

#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.cf { position: absolute; top: -50px; animation: fall linear forwards; }
.shake { animation: shake .4s ease; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-6px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes spinIn { from { transform: scale(0) rotate(-360deg); } to { transform: scale(1) rotate(0); } }
@media (max-width: 480px) {
  .games { grid-template-columns: 1fr 1fr; gap: 10px; }
  .game { flex-direction: column; text-align: center; padding: 14px 8px; gap: 4px; }
  .game h2 { font-size: 19px; }
  .pic { font-size: 80px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';
/* =========================================================
   재미있는 한글놀이 (7살)
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (arr, n) => shuffle(arr.slice()).slice(0, n);

/* ---------- 한글 자모 ---------- */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
const BASIC_C = [0, 2, 3, 5, 6, 7, 9, 11, 12, 14, 15, 16, 17, 18];   // ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ
const DOUBLE_C = [1, 4, 8, 10, 13];                                 // ㄲㄸㅃㅆㅉ
const BASIC_V = [0, 4, 8, 13, 18, 20];                              // ㅏㅓㅗㅜㅡㅣ
const MORE_V = [2, 6, 12, 17, 1, 5];                                // ㅑㅕㅛㅠㅐㅔ
const EASY_T = [1, 4, 8, 16, 17, 21];                               // ㄱㄴㄹㅁㅂㅇ
const compose = (c, j, t = 0) => String.fromCharCode(0xac00 + (c * 21 + j) * 28 + t);
const decompose = (ch) => { const k = ch.charCodeAt(0) - 0xac00; return [Math.floor(k / 588), Math.floor((k % 588) / 28), k % 28]; };
const isSyl = (ch) => { const k = ch.charCodeAt(0); return k >= 0xac00 && k <= 0xd7a3; };
const JAMO_NAME = { 'ㄱ': '기역', 'ㄴ': '니은', 'ㄷ': '디귿', 'ㄹ': '리을', 'ㅁ': '미음', 'ㅂ': '비읍', 'ㅅ': '시옷', 'ㅇ': '이응', 'ㅈ': '지읒', 'ㅊ': '치읓', 'ㅋ': '키읔', 'ㅌ': '티읕', 'ㅍ': '피읖', 'ㅎ': '히읗',
  'ㅏ': '아', 'ㅑ': '야', 'ㅓ': '어', 'ㅕ': '여', 'ㅗ': '오', 'ㅛ': '요', 'ㅜ': '우', 'ㅠ': '유', 'ㅡ': '으', 'ㅣ': '이' };

// 한 글자를 살짝 바꿔 헷갈리는 보기 만들기
function mutate(syl) {
  let [c, j, t] = decompose(syl);
  const r = Math.random();
  if (r < 0.4) c = pick(BASIC_C.filter((x) => x !== c));
  else if (r < 0.75) j = pick([...BASIC_V, ...MORE_V].filter((x) => x !== j));
  else t = t ? 0 : pick(EASY_T);
  return compose(c, j, t);
}
function nearSyls(syl, n) {
  const out = new Set();
  for (let k = 0; k < 60 && out.size < n; k++) { const m = mutate(syl); if (m !== syl) out.add(m); }
  return [...out];
}

/* ---------- 낱말 그림 사전 ---------- */
const WORDS = (`사과🍎 포도🍇 우유🥛 기차🚂 나비🦋 오리🦆 하마🦛 토끼🐰 사자🦁 여우🦊 버스🚌 시계⏰ 모자🧢 가방🎒 우산☂️ 의자🪑 거미🕷️ 개미🐜 고래🐋 수박🍉 딸기🍓 피자🍕 치즈🧀 나무🌳 구름☁️ 바다🌊 기린🦒 펭귄🐧 문어🐙 상어🦈 당근🥕 감자🥔 돼지🐷 사탕🍬 풍선🎈 선물🎁 열쇠🔑 가위✂️ 연필✏️ 안경👓 양말🧦 장갑🧤 로봇🤖 공룡🦖 로켓🚀 왕관👑 기타🎸 계란🥚 쿠키🍪 라면🍜 지구🌍 자석🧲 리본🎀 이빨🦷 유령👻 박수👏 침대🛏️ 신발👟 바지👖 가지🍆 호박🎃 버섯🍄 ` +
  `강아지🐶 고양이🐱 호랑이🐯 원숭이🐵 코끼리🐘 병아리🐤 개구리🐸 달팽이🐌 무지개🌈 햄버거🍔 바나나🍌 자동차🚗 비행기✈️ 자전거🚲 소방차🚒 구급차🚑 경찰차🚓 눈사람⛄ 옥수수🌽 토마토🍅 피아노🎹 거북이🐢 물고기🐟 다람쥐🐿️ 오징어🦑 고구마🍠 도토리🌰 ` +
  `해☀️ 달🌙 별⭐ 꽃🌸 공⚽ 책📚 곰🐻 뱀🐍 말🐴 양🐑 닭🐔 소🐮 벌🐝 꿀🍯 빵🍞 집🏠 문🚪 배🍐 귤🍊`)
  .trim().split(/\s+/).map((s) => { const w = s.match(/^[가-힣]+/)[0]; return { w, e: s.slice(w.length) }; });
const byLen = (fn) => WORDS.filter((x) => fn(x.w.length));
const findWord = (w) => WORDS.find((x) => x.w === w);

/* ---------- 문장 자료 ---------- */
const SENT = [
  [ // 쉬움: 흉내 내는 말 · 색깔
    ['🐶', '강아지가 {} 짖어요.', ['멍멍', '야옹', '꿀꿀', '음매']],
    ['🐱', '고양이가 {} 울어요.', ['야옹', '멍멍', '꽥꽥', '음매']],
    ['🐷', '돼지가 {} 울어요.', ['꿀꿀', '야옹', '개굴', '음매']],
    ['🐮', '소가 {} 울어요.', ['음매', '꿀꿀', '멍멍', '꽥꽥']],
    ['🐤', '병아리가 {} 울어요.', ['삐약삐약', '음매음매', '꿀꿀꿀꿀', '멍멍멍멍']],
    ['🦆', '오리가 {} 울어요.', ['꽥꽥', '야옹', '멍멍', '꿀꿀']],
    ['🐸', '개구리가 {} 울어요.', ['개굴개굴', '삐약삐약', '야옹야옹', '음매음매']],
    ['🍎', '사과는 {}이에요.', ['빨간색', '파란색', '검은색', '하얀색']],
    ['🍌', '바나나는 {}이에요.', ['노란색', '파란색', '검은색', '보라색']],
    ['🌊', '바다는 {}이에요.', ['파란색', '빨간색', '노란색', '검은색']],

    ['🍇', '포도는 {}이에요.', ['보라색', '노란색', '하얀색', '파란색']],
    ['🐰', '토끼가 {} 뛰어요.', ['깡충깡충', '엉금엉금', '뒤뚱뒤뚱', '꿈틀꿈틀']],
    ['🐢', '거북이가 {} 기어가요.', ['엉금엉금', '깡충깡충', '훨훨', '쌩쌩']],

}

    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();

};

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.85;

/* ---------- 플레이 공통 ---------- */
function startGame(gid, lv) {
  const g = GAMES.find((x) => x.id === gid);
  play = { g, lv, idx: 0, total: g.total || 10, results: [], mistakes: 0, combo: 0, maxCombo: 0, firstOk: 0, recent: [], times: [] };
  view = { name: 'play', g: gid };
  app.innerHTML = `<div class="screen play">
    <div class="topbar"><button class="icon" data-act="quit">✕</button><div class="ttl">${g.emoji} ${g.title} · ${g.levels[lv].n}</div>
      <button class="icon" data-act="speak" title="읽어주기">🔊</button><button class="icon" data-act="sound">${S.sound ? '🔔' : '🔕'}</button></div>
    <div class="path" id="path"></div>
    <div class="qcard" id="qcard"></div>
    <div class="answer" id="answer"></div>
  </div>`;
  newQ();
}
function genQ() {
  const p = play;
  for (let k = 0; k < 30; k++) {
    const q = p.g.gen(p.lv);
    if (!p.recent.includes(q.key) || k === 29) { p.recent.push(q.key); if (p.recent.length > 8) p.recent.shift(); return q; }
  }
}
function renderPath() {
  const p = play; let h = '';
  for (let i = 0; i < p.total; i++) {
    const done = i < p.idx;
    h += `<span class="step ${done ? 'done' : ''} ${i === p.idx ? 'cur' : ''}">${done ? (p.results[i] ? '⭐' : '🌱') : ''}${i === p.idx ? '<span class="runner">🐥</span>' : ''}</span>`;
  }
  $('#path').innerHTML = h + '<span class="goal">🏡</span>';
}
function newQ() {
  const p = play, q = genQ();
  Object.assign(p, { q, tries: 0, locked: false, qStart: Date.now() });
  renderPath();
  if (p.g.type === 'trace') return traceQ();
  if (p.g.type === 'order') return orderQ();
  $('#qcard').innerHTML = `${q.html}<div class="feedback" id="fb"></div>`;
  $('#answer').innerHTML = `<div class="choices">${q.choices.map((c, i) => {
    const pic = q.withPic ? (findWord(c) || {}).e : '';
    return `<button class="choice c${i}" data-act="choose" data-i="${i}">${pic ? `<small>${pic}</small>` : ''}${c}</button>`; }).join('')}</div>`;
  if (q.autoSay) setTimeout(() => { if (play && play.q === q) speak(q.say, true); }, 350);
}
function fb(html, cls) { const el = $('#fb'); if (el) { el.className = 'feedback ' + cls; el.innerHTML = html; } }
function later(fn, ms) { const p = play; setTimeout(() => { if (play === p) fn(); }, ms); }
function timeTag() {
  const sec = (Date.now() - play.qStart) / 1000;
  play.times.push(sec);
  return ` <span class="sec ${sec < 3 ? 'fast' : ''}">${sec < 3 ? '⚡' : '⏱️'} ${sec.toFixed(1)}초</span>`;
}
function markCorrect() {
  const p = play, first = p.tries === 0;
  p.locked = true; p.results[p.idx] = first; sfx.ok();
  if (first) { p.firstOk++; p.combo++; p.maxCombo = Math.max(p.maxCombo, p.combo); }
  let msg = pick(PRAISE) + timeTag();
  if (first && p.combo >= 3) msg += ` <span class="combo">🔥 ${p.combo}연속!</span>`;
  confetti(first && p.combo >= 3 ? 14 : 6);
  return msg;
}
function showNextBtn() { $('#answer').innerHTML = '<button class="btn nextbtn" data-act="next">다음 ▶</button>'; }
function nextQ() { const p = play; p.idx++; if (p.idx >= p.total) return finish(); newQ(); }

/* ---------- 보기 고르기 ---------- */
function choose(i, btn) {
  const p = play, q = p.q;
  if (p.locked) return;
  if (q.choices[i] === q.ans) {
    btn.classList.add('rightc');
    const msg = markCorrect();
    const hole = $('#hole'); if (hole && q.fill) { hole.textContent = q.ans; hole.classList.add('good'); }
    if (q.showPicAfter) fb(`<span style="font-size:44px">${q.showPicAfter}</span> ${msg}`, 'good'); else fb(msg, 'good');
    speak(q.after);
    later(nextQ, 1500);
    return;
  }
  sfx.bad(); p.combo = 0; shake($('#qcard'));
  btn.disabled = true;
  p.tries++;
  if (p.tries === 1) { p.mistakes++; fb(pick(RETRY), 'bad'); return; }
  p.locked = true; p.results[p.idx] = false;
  const hole = $('#hole'); if (hole && q.fill) { hole.textContent = q.ans; hole.classList.add('reveal'); }
  document.querySelectorAll('.choice').forEach((b, k) => { if (q.choices[k] === q.ans) b.classList.add('rightc'); });
  fb(`정답은 <b>${q.ans}</b> 이에요. 다음엔 꼭 맞힐 수 있어! 💪`, 'bad');
  speak(q.after);
  showNextBtn();
}

/* ---------- 따라쓰기 ---------- */
const CELL = 300, FONT = "'Jua', 'Malgun Gothic', sans-serif";
const PENS = ['#ff6b9a', '#4dabf7', '#51cf66', '#ffa94d', '#9775fa'];
let pen = PENS[0];
function glyphSize(t) { return /[ㄱ-ㅣ]/.test(t) ? CELL * 0.92 : CELL * 0.8; }
function drawGlyph(ctx, t, color, strokeW) {
  ctx.font = `${glyphSize(t)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineJoin = 'round'; ctx.lineWidth = strokeW || 1;
  [...t].forEach((ch, i) => { const x = CELL * (i + 0.5), y = CELL * 0.55; ctx.fillText(ch, x, y); if (strokeW) ctx.strokeText(ch, x, y); });
}
function drawGuide(ctx, t) {
  const n = [...t].length;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, CELL * n, CELL);
  for (let i = 0; i < n; i++) {
    ctx.strokeStyle = '#ffc9dc'; ctx.lineWidth = 4; ctx.setLineDash([]);
    ctx.strokeRect(i * CELL + 6, 6, CELL - 12, CELL - 12);
    ctx.strokeStyle = '#ffe3ee'; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
    ctx.beginPath(); ctx.moveTo(i * CELL + CELL / 2, 12); ctx.lineTo(i * CELL + CELL / 2, CELL - 12);
    ctx.moveTo(i * CELL + 12, CELL / 2); ctx.lineTo(i * CELL + CELL - 12, CELL / 2); ctx.stroke();
  }
  ctx.setLineDash([]);
  drawGlyph(ctx, t, '#eef0f5');
  ctx.setLineDash([10, 8]); ctx.lineWidth = 3; ctx.strokeStyle = '#b8c0d0';
  ctx.font = `${glyphSize(t)}px ${FONT}`;
  [...t].forEach((ch, i) => ctx.strokeText(ch, CELL * (i + 0.5), CELL * 0.55));
  ctx.setLineDash([]);
}
function drawStrokes(ctx, strokes, w, colorFixed) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = w;
  for (const s of strokes) {
    ctx.strokeStyle = colorFixed || s.c;
    ctx.beginPath(); ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]);
    for (const pt of s.pts) ctx.lineTo(pt[0], pt[1]);
    ctx.stroke();
  }
}
function traceQ() {
  const p = play, q = p.q, n = [...q.target].length, W = CELL * n;
  p.strokes = [];
  $('#qcard').innerHTML = `
    <div class="tinfo">${q.pic ? `<span class="pe">${q.pic}</span>` : ''}<span>회색 글자를 따라 써요!</span>${q.name ? `<span class="tn">(${q.name})</span>` : ''}</div>
    <div class="board" style="max-width:${n === 1 ? 340 : 560}px"><canvas id="guide" width="${W}" height="${CELL}"></canvas><canvas class="ink" id="ink" width="${W}" height="${CELL}"></canvas></div>
    <div class="colors">${PENS.map((c) => `<button style="background:${c}" class="${c === pen ? 'on' : ''}" data-act="pen" data-c="${c}"></button>`).join('')}</div>
    <div class="feedback" id="fb"></div>`;
  $('#answer').innerHTML = `<div class="tbtns"><button class="btn ghost" data-act="erase">🧽 지우기</button><button class="btn green" data-act="check">다 썼어요 ✔</button></div>`;
  const draw = () => drawGuide($('#guide').getContext('2d'), q.target);
  draw();
  if (document.fonts && document.fonts.load) document.fonts.load(`100px Jua`, q.target).then(() => { if (play && play.q === q) draw(); }).catch(() => {});
  setupInk($('#ink'));
  speak(q.say);
}
function setupInk(cv) {
  const ctx = cv.getContext('2d');
  let cur = null;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', (e) => {
    if (!play || play.locked) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    cur = { c: pen, pts: [pos(e)] }; play.strokes.push(cur);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = CELL * 0.075; ctx.strokeStyle = pen;
    ctx.beginPath(); ctx.moveTo(cur.pts[0][0], cur.pts[0][1]); ctx.lineTo(cur.pts[0][0] + 0.1, cur.pts[0][1]); ctx.stroke();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!cur) return;
    const a = cur.pts[cur.pts.length - 1], b = pos(e);
    cur.pts.push(b);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  });
  const end = () => { cur = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
function scoreTrace() {
  const q = play.q, W = CELL * [...q.target].length, H = CELL;
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d', { willReadFrequently: true }); };
  const g = mk(); drawGlyph(g, q.target, '#000');
  const gx = mk(); drawGlyph(gx, q.target, '#000', CELL * 0.12);
  const thick = mk(); drawStrokes(thick, play.strokes, CELL * 0.17, '#000');
  const thin = mk(); drawStrokes(thin, play.strokes, CELL * 0.075, '#000');
  const gd = g.getImageData(0, 0, W, H).data, gxd = gx.getImageData(0, 0, W, H).data, td = thick.getImageData(0, 0, W, H).data, nd = thin.getImageData(0, 0, W, H).data;
  let gl = 0, cov = 0, ink = 0, out = 0;
  for (let i = 3; i < gd.length; i += 8) {
    if (gd[i] > 128) { gl++; if (td[i] > 0) cov++; }
    if (nd[i] > 128) { ink++; if (gxd[i] === 0) out++; }
  }
  return { cov: gl ? cov / gl : 0, out: ink ? out / ink : 1, ink };
}
function checkTrace() {
  const p = play;
  if (p.locked) return;
  if (!p.strokes.length) { fb('먼저 손가락으로 따라 써 봐요! ✍️', 'bad'); shake($('.board')); return; }
  const r = scoreTrace();
  const pass = r.cov >= 0.6 && r.out <= 0.3;
  if (pass) {
    let msg = markCorrect();
    if (r.cov >= 0.8 && r.out <= 0.2) msg = '💯 아주 예쁘게 썼어요! ' + msg;
    fb(msg, 'good'); speak(p.q.say);
    showNextBtn();
    return;
  }
  sfx.bad(); p.combo = 0; shake($('.board'));
  p.tries++;
  if (p.tries === 1) p.mistakes++;
  const why = r.cov < 0.6 ? '회색 글자를 끝까지 꽉 채워 써 볼까요? ✍️' : '선 밖으로 조금 나갔어요. 지우고 다시 써 볼까요? 🧽';
  if (p.tries >= 3) { p.locked = true; p.results[p.idx] = false; fb('잘 했어요! 다음 글자도 해 봐요 💪' + timeTag(), 'good'); showNextBtn(); return; }
  fb(why, 'bad');
}
function eraseTrace() {
  const p = play; if (!p || p.locked) return;
  p.strokes = []; const cv = $('#ink'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); fb('', '');
}

/* ---------- 문장 만들기 ---------- */
function orderQ() {
  const p = play, q = p.q;
  p.built = [];
  $('#qcard').innerHTML = `<div class="pic" style="font-size:80px">${q.pic}</div><div class="qtext">낱말 카드를 순서대로 눌러 문장을 만들어요</div>
    <div class="built" id="built"></div><div class="feedback" id="fb"></div>`;
  renderOrder();
}
function renderOrder() {
  const p = play, q = p.q;
  $('#built').innerHTML = p.built.map((i) => `<button class="wcard" data-act="unplace" data-i="${i}">${q.cards[i].w}</button>`).join('');
  $('#answer').innerHTML = `<div class="pool">${q.cards.map((c, i) => (p.built.includes(i) ? '' : `<button class="wcard" data-act="place" data-i="${i}">${c.w}</button>`)).join('')}</div>`;
}
function placeCard(i) {
  const p = play, q = p.q;
  if (p.locked || p.built.includes(i)) return;
  sfx.tap(); p.built.push(i); renderOrder();
  if (p.built.length < q.cards.length) return;
  const said = p.built.map((k) => q.cards[k].w).join(' ');
  if (q.oks.includes(said)) {
    const msg = markCorrect();
    $('#built').classList.add('good');
    $('#answer').innerHTML = '';
    fb(msg, 'good'); speak(said);
    later(nextQ, 2200);
    return;
  }
  sfx.bad(); p.combo = 0; shake($('#built'));
  p.tries++;
  if (p.tries === 1) { p.mistakes++; fb('순서가 조금 달라요. 다시 해 볼까? 🙂', 'bad'); later(() => { p.built = []; renderOrder(); }, 900); return; }
  p.locked = true; p.results[p.idx] = false;
  $('#built').innerHTML = q.oks[0].split(' ').map((w) => `<span class="wcard">${w}</span>`).join('');
  fb('이렇게 만들어요! 소리 내어 읽어 볼까요? 📖', 'bad'); speak(q.oks[0]);
  showNextBtn();
}
function unplaceCard(i) {
  const p = play; if (p.locked) return;
  p.built = p.built.filter((k) => k !== i); sfx.tap(); renderOrder();
}

/* ---------- 결과 ---------- */
function finish() {
  const p = play, ratio = p.mistakes / p.total;
  const stars = ratio <= 0.1 ? 3 : ratio <= 0.3 ? 2 : 1;
  const key = p.g.id + ':' + p.lv, prev = S.stars[key] || 0;
  S.stars[key] = Math.max(prev, stars);
  const stickers = [award()];
  if (stars === 3 && prev < 3) stickers.push(award());
  save(); sfx.win(); confetti(50);
  const t = p.times;
  const r = { gid: p.g.id, lv: p.lv, stars, firstOk: p.firstOk, total: p.total, maxCombo: p.maxCombo, stickers: stickers.filter(Boolean),
    avg: t.length ? t.reduce((a, b) => a + b, 0) / t.length : 0, fastest: t.length ? Math.min(...t) : 0 };
  play = null; view = { name: 'result', r }; render();
}
function renderResult() {
  const r = view.r, g = GAMES.find((x) => x.id === r.gid);
  const msgs = { 3: '완벽해요! 한글 박사예요 👑', 2: '아주 잘했어요! 조금만 더 하면 별 3개! 💪', 1: '끝까지 해냈어요! 다시 하면 더 잘할 거예요 😊' };
  const next = r.lv < g.levels.length - 1 ? r.lv + 1 : null;
  app.innerHTML = `<div class="screen result">
    <div class="re">${r.stars === 3 ? '🏆' : '🎉'}</div>
    <h2>${g.title} · ${g.levels[r.lv].n} 완료!</h2>
    <div class="stars">${[1, 2, 3].map((k) => `<span class="${k <= r.stars ? '' : 'off'}" style="animation-delay:${k * 0.25}s">★</span>`).join('')}</div>
    <p>${msgs[r.stars]}</p>
    <p>한 번에 맞힌 문제 ${r.firstOk} / ${r.total} · 최고 연속 🔥 ${r.maxCombo}</p>
    ${r.avg ? `<p>⏱️ 평균 ${r.avg.toFixed(1)}초 · ⚡ 가장 빨리 ${r.fastest.toFixed(1)}초</p>` : ''}
    ${r.stickers.length ? `<div class="newsticker">새 스티커를 받았어요!<br>${r.stickers.map((s) => `<span>${s}</span>`).join('')}</div>` : ''}
    <div class="acts">
      ${next !== null ? `<button class="btn" data-act="start" data-lv="${next}">다음 단계로 ▶</button>` : ''}
      <button class="btn ${next !== null ? 'ghost' : ''}" data-act="start" data-lv="${r.lv}">🔁 다시 하기</button>
      <button class="btn ghost" data-act="home">🏠 다른 놀이 고르기</button>
    </div>
  </div>`;
  view.g = r.gid;
}

/* ---------- 입력 ---------- */
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'rename': { const n = prompt('이름을 알려 주세요', S.name); if (n !== null) { S.name = n.trim().slice(0, 8); save(); render(); } return; }
    case 'sound': S.sound = !S.sound; save(); el.textContent = S.sound ? '🔔' : '🔕'; sfx.tap(); return;
    case 'voice': S.voice = !S.voice; save(); el.textContent = S.voice ? '🗣️' : '🤐'; if (S.voice) speak('읽어 줄게요'); return;
    case 'home': go({ name: 'home' }); return;
    case 'stickers': go({ name: 'stickers' }); return;
    case 'game': sfx.tap(); go({ name: 'game', g: el.dataset.g }); return;
    case 'start': sfx.tap(); startGame(view.g, +el.dataset.lv); return;
    case 'quit':
      if (play && play.idx > 0 && !confirm('그만하고 나갈까요?')) return;
      go({ name: 'game', g: view.g }); return;
    case 'speak': if (play) speak(play.q.say, true); return;
    case 'choose': if (play) choose(+el.dataset.i, el); return;
    case 'next': if (play) nextQ(); return;
    case 'pen': pen = el.dataset.c; document.querySelectorAll('.colors button').forEach((b) => b.classList.toggle('on', b === el)); return;
    case 'erase': eraseTrace(); return;
    case 'check': checkTrace(); return;
    case 'place': placeCard(+el.dataset.i); return;
    case 'unplace': unplaceCard(+el.dataset.i); return;
  }
});
document.addEventListener('keydown', (e) => {
  if (!play) return;
  if (play.locked && e.key === 'Enter' && $('[data-act="next"]')) { nextQ(); return; }
  if (play.q && play.q.choices && !play.locked) { const i = '1234'.indexOf(e.key); if (i >= 0) { const b = document.querySelectorAll('.choice')[i]; if (b && !b.disabled) b.click(); } }
});
if ('speechSynthesis' in window) speechSynthesis.getVoices();
render();
</script>
</body>
</html>
